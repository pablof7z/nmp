[package]
name = "nmp-bdd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "BDD acceptance layer: cucumber-rs Gherkin scenarios driven against the REAL engine (docs/bdd/000-bdd-approach.md)."

# Test-only crate: no lib target of production value, never depended on by
# any other crate. `src/` is a thin library purely so `tests/bdd.rs` (the
# `harness = false` cucumber entry point) can `use nmp_bdd::...`.
[lib]
name = "nmp_bdd"
path = "src/lib.rs"
doctest = false

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false

[dependencies]
nostr.workspace = true
nmp-grammar.workspace = true
nmp-store.workspace = true
nmp-resolver.workspace = true
nmp-router.workspace = true
nmp-transport.workspace = true
nmp-local-signer.workspace = true
nmp-signer.workspace = true
# `unstable-mechanism` is #52 Q3's sanctioned injection hatch and this crate
# is the consumer it exists for: it builds the REAL engine over an isolated
# temporary Redb store and a static neutral fact snapshot of scripted relays,
# and takes the same engine's `Handle` back out to fold the raw delta and
# diagnostics channels its `Then` steps assert on. `nip65` drives the
# feature-on coordinator scenarios through ordinary pinned queries.
nmp = { workspace = true, features = ["unstable-mechanism", "nip29", "nip65"] }
nmp-test-support.workspace = true

cucumber = "0.21"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
