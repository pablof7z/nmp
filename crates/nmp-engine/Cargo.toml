[package]
name = "nmp-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

test-instrumentation = ["nmp-store/test-instrumentation"]

# THE DEPENDENCY LIST IS THE POINT OF THIS CRATE.
#
# `EngineCore` is a synchronous reducer: `handle(EngineMsg) -> Vec<Effect>`,
# `tick(Timestamp) -> Vec<Effect>`. It performs concrete redb I/O and owns no
# threads, no sockets, and no imposed runtime. That used to be a sentence in
# `nmp/src/lib.rs`; here it is a build error to violate. There is no `tokio`,
# no `crossbeam-channel`, no `futures-channel`, no `reqwest` below, and
# nothing in this package may add one -- the async edge that interprets these
# effects is `nmp-runtime`, and the HTTP that produces NIP-11 documents is
# `nmp-nip11`. Same play `nmp-signer` makes by naming `zeroize` alone.
#
# `nmp-transport` is here for its FRAME VALUE TYPES (`RelayFrame`,
# `TransportRelayHandle`, disconnect reasons) -- the vocabulary the reducer
# reduces over. It never opens a socket.
[dependencies]
nostr.workspace = true
nmp-grammar.workspace = true
nmp-store.workspace = true
nmp-router.workspace = true
nmp-resolver.workspace = true
nmp-transport.workspace = true
nmp-signer.workspace = true
blake3.workspace = true
# The durable relay-set encoding in `core/write.rs` is lowercase hex.
hex = "0.4"
