[package]
name = "nmp-nip46-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "nmp_nip46_ffi"

[package.metadata.nmp-component]
schema = 1
key = "nmp-nip46"
kind = "optional"
library-stem = "nmp_nip46_ffi"
uniffi-namespace = "nmp_nip46_ffi"
bindgen-bin = "nmp-nip46-uniffi-bindgen"
metadata-audit-bin = "nmp-nip46-metadata-audit"

[[bin]]
name = "nmp-nip46-uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "nmp-nip46-metadata-audit"
path = "metadata-audit.rs"

[dependencies]
camino = "1"
nostr.workspace = true
nmp-component-interface.workspace = true
nmp-nip46.workspace = true
uniffi = { workspace = true, features = ["cli"] }
uniffi_bindgen = "0.29"
uniffi_meta = "0.29"
tokio = { version = "1", features = ["rt", "time", "net"] }
toml05 = { package = "toml", version = "0.5" }

[dev-dependencies]
nmp.workspace = true
nmp-ffi.workspace = true
tempfile = "3"
# `#[tokio::test]` only. The tests must not mint a runtime themselves -- this
# crate is the separately linked provider, and `scripts/test-component-v2-substrate.sh`
# refuses any runtime-authority spelling anywhere in its source. Test-only:
# resolver v2 keeps these features out of the lib/cdylib build.
tokio = { version = "1", features = ["macros", "rt"] }
tungstenite = "0.29"
url = "2"

[build-dependencies]
blake3.workspace = true
serde_json.workspace = true
toml = "0.8"
