name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Every step runs through one hardened shell (#1170). GitHub's default `run:`
# shell honours BASH_ENV, $ENV, profile files, and shell functions inherited
# from the environment, so the command a step names is not necessarily the
# command that runs -- a step can report success having executed something
# else while the workflow text still reads correctly. `-p` makes bash ignore
# all four; `--noprofile --norc` covers the startup files; `-eo pipefail`
# keeps a failure anywhere in a step fatal.
defaults:
  run:
    shell: bash --noprofile --norc -p -eo pipefail {0}

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the exact toolchain (channel + components) pinned by
      # rust-toolchain.toml at the repo root.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace

  # All macOS qualification now lives in macos-qualification.yml. One runner
  # owns the Swift package and iOS Simulator suites instead of making one
  # pull-request head acquire three scarce runners.

  # Clean-clone Kotlin/JVM falsifier smoke test (#40): `Packages/NMPKotlin`
  # depends on uniffi-bindgen-generated Kotlin bindings + a compiled native
  # cdylib that are deliberately NOT committed (see
  # `.gitignore`/`Packages/NMPKotlin/README.md`), the same discipline as the
  # consolidated Swift suite in `.github/workflows/macos-qualification.yml`.
  # Desktop JVM only -- this is the #40 falsifier, not the M6 Android AAR
  # (which needs cargo-ndk cross-compilation and is gated on the M5 human
  # verdict).
  kotlin-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Falsify the Kotlin build script's target-dir resolution
        run: bash scripts/test-build-kotlin-jvm.sh

      - name: Build Kotlin bindings + native lib (host triple)
        run: scripts/build-kotlin-jvm.sh

      - name: gradlew test
        run: ./gradlew test --console=plain
        working-directory: Packages/NMPKotlin
