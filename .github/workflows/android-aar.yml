name: Android AAR

on:
  push:
    branches: [master]
  pull_request:

# Every step runs through one hardened shell (#1170). GitHub's default `run:`
# shell honours BASH_ENV, $ENV, profile files, and shell functions inherited
# from the environment, so the command a step names is not necessarily the
# command that runs. `-p` makes bash ignore imported functions and privileged
# environment startup; `--noprofile --norc` covers startup files; and
# `-eo pipefail` keeps a failure anywhere in a step fatal.
defaults:
  run:
    shell: bash --noprofile --norc -p -eo pipefail {0}

jobs:
  android-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android SDK and NDK inputs
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build, inspect, falsify, and consume the Android matrix
        env:
          NMP_ANDROID_HOSTED_DIR: ${{ runner.temp }}/nmp-android-artifact
          NMP_ANDROID_SCRATCH_PARENT: ${{ runner.temp }}
        run: scripts/check-android-feature-matrix.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nmp-android-aar
          path: ${{ runner.temp }}/nmp-android-artifact
          if-no-files-found: error
