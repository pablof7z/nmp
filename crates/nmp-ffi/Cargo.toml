[package]
name = "nmp-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# M4 plan §2: staticlib for the iOS xcframework, plain lib for the round-trip
# unit tests / the `uniffi-bindgen` bin target below to link against. cdylib
# added for #40 (Kotlin/Flow falsifier) -- UniFFI's Kotlin bindings load the
# core through JNA, which needs a dynamic library (JVM has no static-linking
# story); Swift's own build path (scripts/build-swift-xcframework.sh) still
# only ever asks cargo for the staticlib slices, so this is additive and
# Swift-neutral.
[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "nmp_ffi"

[features]
default = []

# #824: these are the stable app-facing selection keys consumed by the native
# feature manifest. Each key only forwards into its real Cargo dependency;
# Cargo remains the sole dependency graph.
#
# #1707: nip18/nip22/nip25/nipc7/content used to forward into
# `nmp/<feature>` -- `nmp` re-exporting each as a pure door with no engine
# coupling. `nmp` no longer does (those doors are deleted, #1707), so
# each key now pulls its own capability crate directly, same shape NIP-02
# already uses.
nip02 = ["dep:nmp-nip02", "nip65"]
nip18 = ["dep:nmp-nip18"]
nip22 = ["dep:nmp-nip22", "nip65"]
nip25 = ["dep:nmp-nip25"]
# #1707 step 4: nip29 no longer forwards into `nmp/nip29` -- `nmp-nip29`
# owns its own door now, same shape as `nip02` above.
nip29 = ["dep:nmp-nip29", "nip65"]
# The NIP-65 outbox algorithm, compiled in as this artifact's author-route
# provider. `nmp` itself has no routing feature and names no algorithm: the
# provider is a constructor argument, so selecting a different one here would
# be a different crate on this line and nothing else.
nip65 = ["dep:nmp-outbox"]
nipc7 = ["dep:nmp-nipc7"]
content = ["dep:nmp-content"]

# `cargo run -p nmp-ffi --bin uniffi-bindgen generate --library <staticlib> \
#   --language swift --out-dir gen/` (M4 plan §3 step 3, library mode -- reads
# exported metadata straight from the compiled staticlib, no .udl file).
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
nostr.workspace = true
# `nmp-ffi` is an assembly over every crate a native app needs, not a
# consumer of one facade (#1707): engine/query/receipt/signer nouns and
# NIP-65 (the one family `nmp` itself still owns) come through the canonical
# `nmp` facade below, gated by the matching feature. But `nmp` deliberately
# does not and must not re-export a capability's own implementation or
# meaning -- that lives only in the capability's own crate under #1707 --
# so this crate binds `nmp-nip02`/`nmp-nip29`/every other
# capability crate directly, the same edge a direct-Rust app already uses to
# reach them. Neither shape is an exception to the other; a Swift/Kotlin app
# reaches a capability exactly the way a direct-Rust app does, just through
# the one staticlib/cdylib instead of a second `Cargo.toml` line.
#
# The feature list is how this crate turns each optional protocol/content
# family on: one owner per family, gated, rather than an unconditional edge
# to every capability crate whether an app uses it or not.
nmp = { workspace = true }
# #1707: NIP-02's own crate, bound directly for the reason in the paragraph
# above -- `nmp` does not re-export `nmp-nip02`'s implementation.
nmp-nip02 = { workspace = true, optional = true }
# #1707 step 4: same reason, now that NIP-29's Group/group-list-write door
# left `nmp` too.
nmp-nip29 = { workspace = true, optional = true }
# The author-route provider this artifact installs when `nip65` is selected.
nmp-outbox = { workspace = true, optional = true }
# #1707: these used to be pure re-export doors in `nmp` (no engine
# coupling forced them there); now each is bound directly, same reason as
# `nmp-nip02` above.
nmp-nip18 = { workspace = true, optional = true }
nmp-nip22 = { workspace = true, optional = true }
nmp-nip25 = { workspace = true, optional = true }
nmp-nipc7 = { workspace = true, optional = true }
nmp-content = { workspace = true, optional = true }
uniffi = { workspace = true, features = ["cli"] }
zeroize = "1"
k256 = { version = "0.13.4", default-features = false }

# #99/#920: store-owned test-instrumentation fixtures corrupt the exact
# retained receipt and create the markerless schema witness without exposing
# Redb types or tables here.
[dev-dependencies]
# #851/#934: the ONE mechanism value this crate still reaches for, and only
# from `#[cfg(test)]`. `nmp` re-exports `ShortfallFact`, whose
# `NoPlannedSource`/`LocalLimit` variants carry an `atom: ConcreteFilter`
# field the facade does not project -- so the acquisition-evidence falsifier
# cannot build its own fixture atom through `nmp` alone. Filed as #934. A
# dev-dependency is not a production edge: `cargo build -p nmp-ffi` cannot
# resolve `nmp_grammar::` at all, so the compiler itself proves the
# staticlib/cdylib binds nothing from it.
nmp-grammar.workspace = true
nmp-test-support.workspace = true
nmp-store = { workspace = true, features = ["test-instrumentation"] }
tempfile = "3"
tungstenite = "0.29"
url = "2"
# #680 async observation falsifiers drive the pull-based `next()` futures with a
# real executor. `#[tokio::test]` only, dev-only — production stays runtime-free.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
