[package]
name = "nmp-nip68"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Engine-free by default (the nmp-nip29/nmp-blossom discipline, #115): this
# crate NEVER signs and NEVER touches the engine -- it owns the NIP-68 kind:20
# picture-first event SCHEMA only. No engine feature exists; there is nothing
# in this unit that would consume a router/resolver/store.
default = []

# #898: a NIP-68 image is minted only from `nmp_asset::VerifiedAsset` -- a
# proof computed from exact bytes some constructor actually saw, never from a
# caller-claimed hash or an unverified BUD-02 descriptor (the #421 "protected
# kind without artifact provenance fails" contract). This crate names NO
# storage-protocol crate: `nmp-blossom` is how a `VerifiedAsset` gets minted
# for an uploaded blob, but that is `nmp-blossom`'s/its callers' business, not
# a dependency the NIP-68 schema owner needs to describe an image.
[dependencies]
nostr.workspace = true
nmp-asset.workspace = true
