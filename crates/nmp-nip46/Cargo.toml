[package]
name = "nmp-nip46"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The provider implements its exact NIP-46 RPC/message shape in `nip46.rs`.
# It uses rust-nostr only for ordinary events/keys and NIP-44 crypto; enabling
# rust-nostr's `nip46` umbrella here would unify that optional feature into the
# separately packaged core native artifact.
nostr = { workspace = true, features = ["nip44"] }
nmp-signer.workspace = true
nmp-transport.workspace = true
# #885: the bunker-relay pool dials under the shared destination policy.
nmp-network-policy.workspace = true
# #704: the standalone provider runtime and transport threads share NMP's
# process-wide OS-thread instrumentation.
nmp-executor.workspace = true
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = "1"

[dev-dependencies]
nmp.workspace = true
nmp-grammar.workspace = true
nmp-resolver.workspace = true
nmp-router.workspace = true
nmp-store.workspace = true
tempfile = "3"
tungstenite = "0.29"
