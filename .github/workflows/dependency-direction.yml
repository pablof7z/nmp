# #922: dependency direction read from Cargo's resolved, locked, all-features
# normal/build graph.
#
# Enumeration comes from the graph itself, so a new workspace package is
# checked with no action by its author: an unclassified `nmp`/`nmp-*` package
# fails closed, and a forbidden edge fails whether it is direct, transitive
# through an unclassified intermediary, or reachable only under a non-default
# feature. This is the property `nmp-audit` did not have (#859) -- it
# discovered crates only through their voluntary dependency on it.
#
# This is its own workflow so dependency-direction failures have a dedicated
# check name. It runs one repository script over repository content and uses no
# secret.

name: Dependency direction

on:
  push:
    branches: [master]
  pull_request:

# Every step runs through one hardened shell (#1170). GitHub's default `run:`
# shell honours BASH_ENV, $ENV, profile files, and shell functions inherited
# from the environment, so the command a step names is not necessarily the
# command that runs -- a step can report success having executed something
# else while the workflow text still reads correctly. `-p` makes bash ignore
# all four; `--noprofile --norc` covers the startup files; `-eo pipefail`
# keeps a failure anywhere in a step fatal.
defaults:
  run:
    shell: bash --noprofile --norc -p -eo pipefail {0}


jobs:
  dependency-direction:
    name: Resolved dependency direction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain
        run: rustup show

      - name: Refuse forbidden edges in the resolved workspace graph
        run: bash scripts/check-dependency-direction.sh

      - name: Falsify the graph, classification, and wrapper behaviour
        run: bash scripts/test-dependency-direction.sh
