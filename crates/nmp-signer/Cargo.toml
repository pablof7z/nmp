[package]
name = "nmp-signer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# NIP-46 supplies the typed message/event helpers; the adapter still parses
# the current URI/handshake additions itself because rust-nostr 0.44 models
# the older connect shape.
nostr = { workspace = true, features = ["nip46"] }
nmp-transport.workspace = true
# #885: the bunker-relay pool dials under the shared destination policy.
nmp-network-policy.workspace = true
# #704: reduced to the process-wide OS-thread-spawn counter only; the
# standalone NIP-46 runtime's worker threads bump it via `on_thread_start`.
nmp-executor.workspace = true
crossbeam-channel = "0.5"
# #704: NIP-46 session workers/forwarders/switch-relays/result-map are async
# tasks on a tokio runtime — the engine's shared handle when engine-associated,
# or a small session-owned runtime for standalone direct-Rust connects.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = "1"
# #765: `LocalKeySigner` owns its secret scalar in one compiler-fenced
# zeroizing allocation and never constructs a long-lived `nostr::Keys`,
# `nostr::SecretKey`, or `secp256k1::Keypair` — those are `Copy` and only
# offer `non_secure_erase`. The operation-scoped BIP-340/NIP-44 path in
# `local_crypto.rs` is therefore built over `k256`'s `Zeroize`-aware
# scalar/point types plus `sha2`/`base64`, so every NMP-owned secret buffer
# has an explicit wiping owner.
base64.workspace = true
sha2.workspace = true
# `nsec` decoding straight into that owner, without an intermediate
# `nostr::SecretKey`.
bech32 = "0.11"
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic", "ecdh", "std"] }

[dev-dependencies]
tungstenite = "0.29"
