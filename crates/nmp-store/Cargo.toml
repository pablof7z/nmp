[package]
name = "nmp-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Store-owned instrumentation other crates' tests and evidence binaries
# reach for: the corruption fixtures, and the query/coverage work counters the
# hot path would otherwise pay an atomic increment for. Normal engine and
# native builds compile neither.
test-instrumentation = []

[dependencies]
nostr.workspace = true
nmp-grammar.workspace = true
# Redb is NMP's one complete store. It is a pure-Rust embedded ACID key-value
# store with no C toolchain or build script.
redb = "4.1"
# `RedbStore` canonical event rows use a versioned portable binary envelope
# for borrowed query filtering. Durable-delivery control records use their own
# explicit binary codec; coverage and tombstone records remain typed serde JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
