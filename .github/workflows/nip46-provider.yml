name: Optional NIP-46 provider

on:
  push:
    branches: [master]
  pull_request:

jobs:
  change-routing:
    name: NIP-46 change routing
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.route.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run on master or classify pull-request changes
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          required=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if candidate=$(scripts/check-nip46-provider-changes.sh "$BASE_SHA" "$HEAD_SHA") &&
              [[ "$candidate" == "true" || "$candidate" == "false" ]]; then
              required=$candidate
            else
              echo "::warning::NIP-46 change classification failed; running proofs"
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [[ "$required" == "true" ]]; then
            echo "NIP-46 package proofs are required" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NIP-46 package proofs are unaffected and will be skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

  package-removal:
    name: NIP-46 package removal
    needs: change-routing
    if: needs.change-routing.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Delete NIP-46 and prove core plus an unrelated signer
        run: scripts/test-nip46-provider-removal.sh

  # Swift provider qualification shares the one macOS runner owned by
  # macos-qualification.yml. The Ubuntu removal and Kotlin proofs stay here.

  kotlin-provider:
    name: Kotlin NIP-46 component
    needs: change-routing
    if: needs.change-routing.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build core and provider bindings
        run: |
          scripts/build-kotlin-jvm.sh
          cp Packages/NMPKotlin/src/main/resources/linux-x86-64/libnmp_ffi.so \
            "$RUNNER_TEMP/libnmp_ffi-core-only.so"
          scripts/build-kotlin-nip46-jvm.sh

      - name: Falsify managed v2 roots, manifests, attestations, and artifacts
        run: scripts/test-component-identity-build.sh

      - name: Prove exact core, provider, and interface v2 identities
        run: |
          scripts/check-nip46-component-identity.sh \
            "$RUNNER_TEMP/libnmp_ffi-core-only.so" \
            Packages/NMPKotlin/src/main/resources/linux-x86-64/libnmp_ffi.so \
            Packages/NMPKotlin/nip46/src/main/resources/linux-x86-64/libnmp_nip46_ffi.so

      - name: Prove the provider is absent from the core link/resource maps
        run: |
          scripts/check-nip46-artifact-inventory.sh \
            Packages/NMPKotlin/src/main/resources/linux-x86-64/libnmp_ffi.so \
            Packages/NMPKotlin/nip46/src/main/resources/linux-x86-64/libnmp_nip46_ffi.so \
            Packages/NMPKotlin/src/main/kotlin/uniffi \
            Packages/NMPKotlin/nip46/src/main/kotlin/uniffi

      - name: Test the selectable provider module
        run: ./gradlew :nip46:test --console=plain
        working-directory: Packages/NMPKotlin
