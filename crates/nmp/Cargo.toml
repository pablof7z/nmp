[package]
name = "nmp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# #52 Q3 (Fable checkpoint): the ONLY sanctioned way to inject a pre-built
# store plus a static neutral fact snapshot, needed by `nmp-bdd` (spawns the
# real `EngineThread` against scripted in-process relays). Off by default; enabling
# it in a consumer's `Cargo.toml` is a greppable, reviewable line -- a
# stability exception, not a security one (the acceptance-boundary verify in
# `crate::core` covers every path regardless, Unit A0/#56).
unstable-mechanism = []

# #851: NIP-22 comment composition/decode, projected through the canonical
# facade so direct Rust and `nmp-ffi` share ONE owner for those values. The
# mechanism crate stays optional -- an app that never composes a comment does
# not link it -- but an app that does gets it through `nmp`, never as a
# second direct dependency alongside the facade. Non-default, so the governed
# default-feature surface snapshot is unchanged.
nip22 = ["dep:nmp-nip22"]

# #155/#1239: NIP-25 reaction composition, projected through the canonical
# facade for the same reason `nip22` is -- a direct-Rust app reaches a protocol
# family through `nmp`, never as a second direct dependency alongside the
# facade, which is the split #1239 records for four other families. The
# mechanism crate stays optional: an app that never composes a reaction does
# not link it. Non-default, so the governed default-feature surface snapshot is
# unchanged.
nip25 = ["dep:nmp-nip25"]

# Pure Rust NIP-65 values plus the private automatic coordinator assembly.
# Off by default: core-only builds contain no protocol dependency or symbols.
nip65 = ["dep:nmp-nip65"]

# #1239: the retrofit. Each family below was reachable from `nmp-ffi` and NOT
# from this facade, so a Swift app linking the one staticlib got it while a
# direct-Rust app had to name a second crate in its own `Cargo.toml` -- the
# exact shape `nmp-consumer-check` exists to forbid, in the direction that
# penalises the tier NMP calls primary. Each follows the `nip22` shape above
# for the same reason it does: ONE owner of the values, and an app that never
# uses the family does not link its crate. All non-default, so the governed
# default-feature surface snapshot is unchanged by any of them.
#
# `nmp-nip02` is NOT here and cannot be: it is a `protocol-service` in
# `scripts/dependency-direction-policy.json`, meaning it sits ABOVE the facade
# and depends on `nmp` itself. An `nmp -> nmp-nip02` edge is a cyclic package
# dependency cargo refuses to resolve, so reaching the follow service through
# the facade needs the service's engine coupling inverted first, not a feature.
nip18 = ["dep:nmp-nip18"]
nip51 = ["dep:nmp-nip51"]
nipc7 = ["dep:nmp-nipc7"]
content = ["dep:nmp-content"]

# Exact-byte asset identity (#884's one protocol-neutral owner). Separate from
# `blossom` because an app can hash and verify bytes without ever speaking to a
# Blossom server -- mosaico does exactly that. `blossom` turns it on because
# `BlobDescriptor`/`VerifiedUpload` name `Sha256Hash` in their public
# signatures: a Blossom door whose own types the caller cannot name would be
# the second Cargo line this feature exists to remove.
asset = ["dep:nmp-asset"]
blossom = ["dep:nmp-blossom", "asset"]

# #827: both instrumentation features came in with the folded engine modules
# (`core`, `runtime`, `outbox`, `negentropy`). They stay non-default, so the
# governed default-feature surface snapshot is unaffected by either.
bench-instrumentation = [
    "dep:libc",
    "nmp-store/bench-instrumentation",
    "nmp-resolver/bench-instrumentation",
    "nmp-transport/bench-instrumentation",
]
test-instrumentation = []

[[example]]
name = "incremental_delta_bench"
required-features = ["bench-instrumentation"]

[[example]]
name = "local_mutation_delta_bench"
required-features = ["bench-instrumentation"]

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
required-features = ["nip65"]

[dependencies]
nostr.workspace = true
nmp-grammar.workspace = true
nmp-nip22 = { workspace = true, optional = true }
nmp-nip25 = { workspace = true, optional = true }
nmp-nip65 = { workspace = true, optional = true }
# #1239: the families the facade did not offer and `nmp-ffi` did. Optional for
# the same reason `nmp-nip22` is -- see the feature block above.
nmp-nip18 = { workspace = true, optional = true }
nmp-nip51 = { workspace = true, optional = true }
nmp-nipc7 = { workspace = true, optional = true }
nmp-content = { workspace = true, optional = true }
nmp-asset = { workspace = true, optional = true }
nmp-blossom = { workspace = true, optional = true }
# #977: the NIP-29 `Group` door. The dependency runs THIS WAY ROUND and
# only this way round -- `Group` is pure composition over `nostr` +
# `nmp-grammar`, and `crate::nip29`'s extension trait is what binds it to
# the one publish door. `scripts/check-nip29-ownership.sh` fails the build
# if `crates/nmp-nip29/Cargo.toml` ever gains the reverse edge.
nmp-nip29.workspace = true
nmp-signer.workspace = true
nmp-local-signer.workspace = true
nmp-store.workspace = true
nmp-router.workspace = true
nmp-resolver.workspace = true
nmp-transport.workspace = true
nmp-executor.workspace = true
# The one pure destination-admission owner (#885): discovery admission and
# the NIP-11 fetcher decide from it instead of re-deriving host rules.
nmp-network-policy.workspace = true
blake3.workspace = true
crossbeam-channel = "0.5"
futures-channel.workspace = true
hickory-resolver.workspace = true
httpdate.workspace = true
# The negentropy reconciler is an engine MODULE (`src/negentropy/`), not a
# crate (§1: reducer-coupled, driven turn-by-turn by `EngineCore`) -- but it
# wraps this external set-reconciliation crate. See
# `src/negentropy/mod.rs` for a naming gotcha this introduces.
negentropy = { version = "0.5", default-features = false, features = ["std"] }
# NEG-OPEN/NEG-MSG wire payloads are lowercase hex (NIP-77) -- already a
# transitive dependency (via `nostr`/`negentropy`'s own dependency graph);
# named directly here because `negentropy/mod.rs` encodes/decodes reconcile
# messages itself (the external `negentropy` crate is payload-agnostic: it
# only deals in raw bytes, never hex text).
hex = "0.4"
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
# #704: the engine owns ONE multi-thread tokio runtime (2 workers) that hosts
# every adapter task (NIP-11 fetches, signer/AUTH completion awaits, optional
# provider sessions, follow-action acquisition) -- replacing the deleted
# internal blocking-adapter executor. `rt-multi-thread` is therefore a
# production feature now, not a dev-only one. `Engine::adapter_runtime()`
# hands protocol adapters that same runtime handle; only the `Handle` type
# crosses the facade boundary.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "sync"] }
libc = { version = "0.2", optional = true }

[dev-dependencies]
# #1105: `group_publication_door.rs` proves a group write never reaches the
# AUTHOR'S OWN outbox, which is only a claim worth making when that outbox is
# real -- discovered from a kind:10002 the engine fetched itself, not
# configured. That discovery is the optional NIP-65 coordinator, so this
# crate's own test targets enable it. Test-only: the default feature set a
# consumer links, and therefore the governed surface snapshot, is unchanged.
# `nip51` joins it for #1239: `nip51_headless.rs` proves the kind:10009 demand
# against a real engine, and it now proves it through `nmp::nip51` -- the same
# path an app has -- instead of through a second `nmp-nip51` dev edge.
nmp = { path = ".", features = ["nip65", "nip51"] }
nmp-test-support.workspace = true
cucumber = "0.21"
# In-process test relay for the runtime (C) integration tests: reconnection
# replay (test 6) and the end-to-end subscribe/publish/reconnect drive.
# Async under the hood (nostr-sdk); confined to dev-dependencies and
# `#[tokio::test]` -- the production `EngineThread`/`Pool` stay free of any
# imposed runtime (D8). Mirrors `nmp-transport`'s own dev-dependency set
# (see that crate's `tests/mock_relay.rs` for the same version-shadowing
# gotcha noted below).
nostr-relay-builder = "0.45.0-alpha.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `watermark_cold_start_offline` (integration_capstone.rs) needs a real
# on-disk `RedbStore` file it can close and reopen across a simulated
# restart -- a throwaway temp dir per test run, same crate `nmp-store`
# already uses for its own `RedbStore` tests.
tempfile = "3"
redb = "4.1"
# `no_deadlines_blocks_indefinitely` (runtime_integration.rs, #39) falsifies
# D8's "no poll-loop timer thread" the only way a black-box test can:
# measuring real process CPU time (`getrusage`) across an idle window, since
# a busy-spinning `recv_timeout(0)` loop would be silently invisible to every
# OTHER assertion available here (no effect crosses the wire when nothing is
# due). Already resolved transitively (mio/tokio/etc.) at the SAME pinned
# version -- this just names it directly for the one test that calls it.
libc = "0.2"
# `neg_liveness_deadline_does_not_busy_spin` (runtime_integration.rs, #39
# fix-up) needs a genuinely uncooperative NIP-77 peer held open for the real
# ~30s liveness window -- `LocalRelay`/`nostr-relay-builder` is a fully
# compliant relay and would converge a real reconciliation long before that,
# so this drives a minimal raw `tungstenite` stub instead (see that test's
# doc). Same version `nmp-transport`'s own production `Pool` speaks on the
# wire (already resolved workspace-wide); this just names it directly for
# the one test that needs to speak it from the SERVER side.
tungstenite = "0.29"
serde = { version = "1", features = ["derive"] }
url = "2"
