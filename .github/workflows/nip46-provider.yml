name: Optional NIP-46 provider

on:
  push:
    branches: [master]
  pull_request:

jobs:
  package-removal:
    name: NIP-46 package removal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Delete NIP-46 and prove core plus an unrelated signer
        run: scripts/test-nip46-provider-removal.sh

  swift-provider:
    name: Swift NIP-46 component
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Add Apple simulator targets
        run: rustup target add aarch64-apple-ios-sim x86_64-apple-ios

      - name: Build core and provider XCFrameworks
        run: |
          scripts/build-swift-xcframework.sh --sim-only
          core_only=$(
            find Packages/NMP/NMP.xcframework -type f -name libnmp_ffi.a |
              grep simulator | sort | head -n 1
          )
          test -n "$core_only"
          cp "$core_only" "$RUNNER_TEMP/libnmp_ffi-core-only.a"
          scripts/build-swift-nip46-xcframework.sh --sim-only

      - name: Prove matched identity and package-set mismatch
        run: |
          matched_core=$(
            find Packages/NMP/NMP.xcframework -type f -name libnmp_ffi.a |
              grep simulator | sort | head -n 1
          )
          matched_provider=$(
            find Packages/NMPNip46/NMPNip46.xcframework -type f -name libnmp_nip46_ffi.a |
              grep simulator | sort | head -n 1
          )
          scripts/check-nip46-component-identity.sh \
            "$RUNNER_TEMP/libnmp_ffi-core-only.a" \
            "$matched_core" \
            "$matched_provider"

      - name: Prove the provider is absent from the core link/resource maps
        run: |
          matched_core=$(
            find Packages/NMP/NMP.xcframework -type f -name libnmp_ffi.a |
              grep simulator | sort | head -n 1
          )
          matched_provider=$(
            find Packages/NMPNip46/NMPNip46.xcframework -type f -name libnmp_nip46_ffi.a |
              grep simulator | sort | head -n 1
          )
          scripts/check-nip46-artifact-inventory.sh \
            "$matched_core" \
            "$matched_provider" \
            Packages/NMP/Sources/NMPFFI \
            Packages/NMPNip46/Sources/NMPNip46FFI

      - name: Test the selectable provider package
        run: swift test
        working-directory: Packages/NMPNip46

  kotlin-provider:
    name: Kotlin NIP-46 component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build core and provider bindings
        run: |
          scripts/build-kotlin-jvm.sh
          cp Packages/NMPKotlin/src/main/resources/linux-x86-64/libnmp_ffi.so \
            "$RUNNER_TEMP/libnmp_ffi-core-only.so"
          scripts/build-kotlin-nip46-jvm.sh

      - name: Refuse unmanaged release identity
        run: scripts/test-component-identity-build.sh

      - name: Prove matched identity and package-set mismatch
        run: |
          scripts/check-nip46-component-identity.sh \
            "$RUNNER_TEMP/libnmp_ffi-core-only.so" \
            Packages/NMPKotlin/src/main/resources/linux-x86-64/libnmp_ffi.so \
            Packages/NMPKotlin/nip46/src/main/resources/linux-x86-64/libnmp_nip46_ffi.so

      - name: Prove the provider is absent from the core link/resource maps
        run: |
          scripts/check-nip46-artifact-inventory.sh \
            Packages/NMPKotlin/src/main/resources/linux-x86-64/libnmp_ffi.so \
            Packages/NMPKotlin/nip46/src/main/resources/linux-x86-64/libnmp_nip46_ffi.so \
            Packages/NMPKotlin/src/main/kotlin/uniffi \
            Packages/NMPKotlin/nip46/src/main/kotlin/uniffi

      - name: Test the selectable provider module
        run: ./gradlew :nip46:test --console=plain
        working-directory: Packages/NMPKotlin
