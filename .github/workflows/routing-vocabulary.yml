# #1105: the app-facing routing vocabulary is exactly two words -- `Auto` and
# `Explicit` -- on Rust, the FFI (both conversion directions), Swift and
# Kotlin alike; every retired spelling stays deleted, including `GroupHost`
# and `AuthorRelayList`; and no group write operation takes a relay or a
# routing value.
#
# The cardinality is read by ENUMERATING each surface's declaration rather
# than by grepping for banned names, which is what catches the failure the
# previous checks could not see: a third word appearing on ONE SDK while
# every Rust test stays green.
#
# This is its own workflow file because .github/workflows/architecture-gates.yml
# is an exact protected path of the surface-governance migration policy
# (scripts/check-surface-migration-authorization.py), and editing it would
# demand an owner-bound authorization status this gate has no need of: it
# runs two repository shell scripts over repository content, uses no secret,
# makes no pull_request_target trust decision, and executes no PR-provided
# code. Same reasoning and same shape as dependency-direction.yml (#922),
# and macos-qualification.yml. Triggers are identical to
# the architecture-gates ones, so the gate runs on every pull request and on
# every push to master exactly as it would have there.

name: Routing vocabulary

on:
  push:
    branches: [master]
  pull_request:

jobs:
  routing-vocabulary:
    name: Two-word routing vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Both steps invoke the script by its exact repository path rather than
      # through an interpreter. `ROUTING-REMOVEDROUTES-001/-002/-003` cite the
      # gate as `script:repository::scripts/check-routing-vocabulary.sh`, and
      # `tools/behavior-traceability` reads a lane only from a step that names
      # the proof tool DIRECTLY -- a `bash` prefix is an environment the
      # locator does not name, so the same command spelled that way maps to no
      # lane at all and the citation fails closed. Both files are executable
      # and carry a shebang; this is the spelling every other governed
      # repository check already uses.
      - name: Falsify a third routing word, a restored spelling, and a relay-taking group verb
        run: scripts/test-check-routing-vocabulary.sh

      - name: Require exactly Auto and Explicit on every surface
        run: scripts/check-routing-vocabulary.sh
