name: Surface governance

# Security boundary: pull_request_target loads this workflow from the default
# branch, never from the proposed head. The job also extracts every executable
# governance script from the base commit. The untrusted head is git data only:
# this workflow never compiles it or invokes any file from it.
#
# Reporting boundary (#1264): four jobs, four claims, so a red check says which
# thing went wrong without anyone opening a log.
#
#   surface-governance-selftest         the gate's own falsifiers and its
#                                       checksum-pinned installer pass, so the
#                                       judge is sound
#   surface-governance-verdict-rendered the gate reached a verdict on this head
#                                       at all
#   surface-governance-current-base     the head is descended from the PR's
#                                       current base, so there was something to
#                                       judge
#   surface-governance                  the base-trusted program accepted this
#                                       head
#
# Only the last is a statement about the proposed change. The first two go red
# when the gate itself is broken, and a broken gate leaves the later checks
# skipped rather than red -- never a rejection that was never rendered. Nothing
# here is fail-open: every one of those reds still blocks, and #608 must require
# all four names, because a skipped check counts as success under branch
# protection.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: read

# Every step runs through one hardened shell (#1170). GitHub's default `run:`
# shell honours BASH_ENV, $ENV, profile files, and shell functions inherited
# from the environment, so the command a step names is not necessarily the
# command that runs -- a step can report success having executed something
# else while the workflow text still reads correctly. `-p` makes bash ignore
# all four; `--noprofile --norc` covers the startup files; `-eo pipefail`
# keeps a failure anywhere in a step fatal.
defaults:
  run:
    shell: bash --noprofile --norc -p -eo pipefail {0}


jobs:
  # Claim: the judge works. Every input this job needs comes from the base, so a
  # red here is never about the proposed change.
  surface-governance-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed head as data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Extract trusted governance program from base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRUSTED_DIR: ${{ runner.temp }}/nmp-surface-governance
        run: |
          mkdir -p \
            "$TRUSTED_DIR/scripts" \
            "$TRUSTED_DIR/scripts/lib" \
            "$TRUSTED_DIR/tools/component-interface-snapshot/src" \
            "$TRUSTED_DIR/tools/rust-facade-snapshot/src" \
            "$TRUSTED_DIR/tools/surface-component-catalog/src"
          for path in \
            scripts/check-surface-migration-authorization.py \
            scripts/check-surface-governance.sh \
            scripts/check-sdk-parity.sh \
            scripts/install-surface-tools.sh \
            scripts/lib/require-commands.sh \
            scripts/regenerate-surface-snapshots.sh \
            scripts/report-surface-governance-verdict.sh \
            scripts/run-surface-regeneration-governance.sh \
            scripts/test-install-surface-tools.sh \
            scripts/test-surface-migration-authorization.py \
            scripts/test-surface-governance.sh \
            tools/surface-toolchain.env \
            tools/component-interface-snapshot/Cargo.toml \
            tools/component-interface-snapshot/Cargo.lock \
            tools/component-interface-snapshot/src/main.rs \
            tools/surface-component-catalog/Cargo.toml \
            tools/surface-component-catalog/Cargo.lock \
            tools/surface-component-catalog/src/main.rs \
            tools/rust-facade-snapshot/Cargo.toml \
            tools/rust-facade-snapshot/Cargo.lock \
            tools/rust-facade-snapshot/src/main.rs; do
            git show "$BASE_SHA:$path" > "$TRUSTED_DIR/$path" || {
              echo "surface-governance-malfunction: the base commit $BASE_SHA does not contain" >&2
              echo "$path, so the trusted program this job needs does not exist yet." >&2
              echo "A pull request that adds a file to the trusted set cannot be judged" >&2
              echo "by it: the judge comes from the base, by design. No verdict was" >&2
              echo "rendered, and the head's copy is deliberately NOT used instead." >&2
              exit 1
            }
          done
          chmod +x "$TRUSTED_DIR/scripts/"*.sh

      - name: Install checksum-pinned surface tool through trusted base script
        # No working-directory and no environment: the installer names every
        # toolchain explicitly and finds its own toolchain definition next to
        # itself, so nothing about where it runs decides what it installs
        # (#1186).
        run: ${{ runner.temp }}/nmp-surface-governance/scripts/install-surface-tools.sh

      - name: Falsify trusted governance and installer
        env:
          SURFACE_CATALOG_TARGET_DIR: ${{ runner.temp }}/nmp-surface-governance-target/catalog
        run: |
          ${{ runner.temp }}/nmp-surface-governance/scripts/test-surface-governance.sh "${{ github.workspace }}"
          ${{ runner.temp }}/nmp-surface-governance/scripts/test-install-surface-tools.sh

  # Claim: a verdict exists. Every step here is part of reaching one, so any
  # failure -- extraction, the API fetch, the install, the toolchain, the
  # checker crashing -- correctly means "no verdict", and the reporter converts
  # a rejection into this job's success because a rejection IS a verdict.
  surface-governance-verdict-rendered:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.verdict.outputs.outcome }}
    steps:
      - name: Check out proposed head as data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Extract trusted governance program from base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRUSTED_DIR: ${{ runner.temp }}/nmp-surface-governance
        run: |
          mkdir -p \
            "$TRUSTED_DIR/scripts" \
            "$TRUSTED_DIR/scripts/lib" \
            "$TRUSTED_DIR/tools/component-interface-snapshot/src" \
            "$TRUSTED_DIR/tools/rust-facade-snapshot/src" \
            "$TRUSTED_DIR/tools/surface-component-catalog/src"
          for path in \
            scripts/check-surface-migration-authorization.py \
            scripts/check-surface-governance.sh \
            scripts/check-sdk-parity.sh \
            scripts/install-surface-tools.sh \
            scripts/lib/require-commands.sh \
            scripts/regenerate-surface-snapshots.sh \
            scripts/report-surface-governance-verdict.sh \
            scripts/run-surface-regeneration-governance.sh \
            scripts/test-install-surface-tools.sh \
            scripts/test-surface-migration-authorization.py \
            scripts/test-surface-governance.sh \
            tools/surface-toolchain.env \
            tools/component-interface-snapshot/Cargo.toml \
            tools/component-interface-snapshot/Cargo.lock \
            tools/component-interface-snapshot/src/main.rs \
            tools/surface-component-catalog/Cargo.toml \
            tools/surface-component-catalog/Cargo.lock \
            tools/surface-component-catalog/src/main.rs \
            tools/rust-facade-snapshot/Cargo.toml \
            tools/rust-facade-snapshot/Cargo.lock \
            tools/rust-facade-snapshot/src/main.rs; do
            git show "$BASE_SHA:$path" > "$TRUSTED_DIR/$path" || {
              echo "surface-governance-malfunction: the base commit $BASE_SHA does not contain" >&2
              echo "$path, so the trusted program this job needs does not exist yet." >&2
              echo "A pull request that adds a file to the trusted set cannot be judged" >&2
              echo "by it: the judge comes from the base, by design. No verdict was" >&2
              echo "rendered, and the head's copy is deliberately NOT used instead." >&2
              exit 1
            }
          done
          chmod +x "$TRUSTED_DIR/scripts/"*.sh

      - name: Fetch PR and owner-status records through the base trust boundary
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_DIR: ${{ runner.temp }}/nmp-surface-governance
        run: |
          mkdir -p "$TRUSTED_DIR/authorization"
          gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            > "$TRUSTED_DIR/authorization/pull-request.json"
          if ! gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/statuses?per_page=100" \
              > "$TRUSTED_DIR/authorization/statuses.json"; then
            # A fork head may not be addressable through the base repository's
            # status endpoint. That is ordinary non-migration work; an actual
            # migration still fails closed because [] cannot authorize it.
            printf '[]\n' > "$TRUSTED_DIR/authorization/statuses.json"
          fi
          printf '{}\n' > "$TRUSTED_DIR/authorization/issue.json"
          target_url=$(
            jq -r --arg context "nmp/surface-governance-migration" '
              [.[] | select(
                type == "object" and .context == $context
              )]
              | sort_by([
                  (.created_at // ""),
                  (if (.id | type) == "number" then .id else -1 end)
                ])
              | if length == 0 then "" else (.[-1].target_url // "") end
            ' "$TRUSTED_DIR/authorization/statuses.json"
          )
          issue_number=${target_url##*/}
          if [[ $issue_number =~ ^[1-9][0-9]*$ &&
                $target_url == "https://github.com/${GITHUB_REPOSITORY}/issues/${issue_number}" ]] &&
              gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
                > "$TRUSTED_DIR/authorization/issue.tmp"; then
            mv "$TRUSTED_DIR/authorization/issue.tmp" \
              "$TRUSTED_DIR/authorization/issue.json"
          fi

      - name: Install checksum-pinned surface tool through trusted base script
        # No working-directory and no environment: the installer names every
        # toolchain explicitly and finds its own toolchain definition next to
        # itself, so nothing about where it runs decides what it installs
        # (#1186).
        run: ${{ runner.temp }}/nmp-surface-governance/scripts/install-surface-tools.sh

      - name: Verify proposed head with trusted base program
        id: verdict
        env:
          SURFACE_ROOT: ${{ github.workspace }}
          SURFACE_BASE_REF: ${{ github.event.pull_request.base.sha }}
          SURFACE_HEAD_REF: ${{ github.event.pull_request.head.sha }}
          SURFACE_CATALOG_TARGET_DIR: ${{ runner.temp }}/nmp-surface-governance-target/catalog
          SURFACE_PR_NUMBER: ${{ github.event.pull_request.number }}
          SURFACE_PR_URL: ${{ github.event.pull_request.html_url }}
          SURFACE_PR_RECORD: ${{ runner.temp }}/nmp-surface-governance/authorization/pull-request.json
          SURFACE_ISSUE_RECORD: ${{ runner.temp }}/nmp-surface-governance/authorization/issue.json
          SURFACE_STATUS_RECORDS: ${{ runner.temp }}/nmp-surface-governance/authorization/statuses.json
          SURFACE_SKIP_REGEN: 1
        # The changed-projection context is derived by the same trusted checker
        # immediately before the run that consumes it, inside the reporter's
        # command, so a failure to derive it is also "no verdict" rather than a
        # verdict nobody rendered.
        run: |
          projections=$(${{ runner.temp }}/nmp-surface-governance/scripts/check-surface-governance.sh --print-projections)
          SURFACE_CHANGED_PROJECTIONS="$projections" \
            ${{ runner.temp }}/nmp-surface-governance/scripts/report-surface-governance-verdict.sh \
              ${{ runner.temp }}/nmp-surface-governance/scripts/check-surface-governance.sh

  # Claim: the head is on the PR's current base. A stale branch says nothing
  # about the diff, so it gets its own name instead of borrowing the verdict's.
  surface-governance-current-base:
    needs: [surface-governance-selftest, surface-governance-verdict-rendered]
    runs-on: ubuntu-latest
    steps:
      - name: Require the head to be descended from the current PR base
        env:
          OUTCOME: ${{ needs.surface-governance-verdict-rendered.outputs.outcome }}
        run: |
          if [[ $OUTCOME == stale-base ]]; then
            echo "surface-governance-current-base: this head is not descended from the current PR base." >&2
            echo "Merge the base branch into this branch and push. Nothing about the change itself was judged." >&2
            exit 1
          fi
          echo "surface-governance-current-base: the head is on the PR's current base"

  # Claim: the head was accepted. This is the only check here that is a
  # statement about the proposed change.
  surface-governance:
    needs: [surface-governance-selftest, surface-governance-verdict-rendered]
    if: needs.surface-governance-verdict-rendered.outputs.outcome != 'stale-base'
    runs-on: ubuntu-latest
    steps:
      - name: Render the base-trusted program's verdict
        env:
          OUTCOME: ${{ needs.surface-governance-verdict-rendered.outputs.outcome }}
        run: |
          case "$OUTCOME" in
            accepted)
              echo "surface-governance: the base-trusted program accepted this head"
              ;;
            rejected)
              echo "surface-governance: the base-trusted program rejected this head." >&2
              echo "Its verdict line is in the surface-governance-verdict-rendered job log." >&2
              exit 1
              ;;
            *)
              echo "surface-governance: no verdict record exists (outcome '$OUTCOME')." >&2
              echo "This is a gate malfunction and must not be read as a rejection." >&2
              exit 70
              ;;
          esac
