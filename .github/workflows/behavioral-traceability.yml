# #1074: NMP keeps two connected but distinct testing maps. `features/` is the
# durable English memory of behavior, organized by behavioral domain;
# executable proof stays with the narrowest contract owner and is referenced
# outward by scenario metadata. This lane validates both maps and the link
# between them, without making the transitional nmp-bdd runner their authority.
#
# It is deliberately runner-independent: `tools/behavior-traceability` is a
# detached Cargo workspace that does not depend on that runner, so governance
# survives its retirement (#1113).
#
# This is its own workflow so traceability failures have a dedicated check
# name. Triggers and strictness are identical to the gate workflow.

name: Behavioral traceability

on:
  push:
    branches: [master]
  pull_request:

# Every step runs through one hardened shell (#1170). GitHub's default `run:`
# shell honours BASH_ENV, $ENV, profile files, and shell functions inherited
# from the environment, so the command a step names is not necessarily the
# command that runs -- a step can report success having executed something
# else while the workflow text still reads correctly. `-p` makes bash ignore
# all four; `--noprofile --norc` covers the startup files; `-eo pipefail`
# keeps a failure anywhere in a step fatal.
defaults:
  run:
    shell: bash --noprofile --norc -p -eo pipefail {0}


jobs:
  behavior-traceability:
    name: Behavioral status and evidence traceability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      TRACE_MANIFEST: ${{ github.workspace }}/tools/behavior-traceability/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # #916 keeps one exact compiler pin. The checker deliberately builds from
      # a neutral directory, so it cannot pick the pin up through directory
      # inheritance; read the single repository pin instead of respelling it.
      - name: Read the one repository toolchain pin
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          channel=$(
            sed -nE \
              's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*(#.*)?$/\1/p' \
              "$GITHUB_WORKSPACE/rust-toolchain.toml"
          )
          [[ $channel =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          printf 'TRACE_TOOLCHAIN=%s\n' "$channel" >> "$GITHUB_ENV"

      - name: Install the exact pinned checker toolchain
        working-directory: ${{ runner.temp }}
        run: rustup toolchain install "$TRACE_TOOLCHAIN" --profile minimal

      # This workflow step reads feature text only as data.
      # The token is scoped to this step and never reaches the head-built Rust
      # checker. The snapshot is sorted, deduplicated, and exact.
      - name: Resolve governed issue state without exposing credentials to head code
        env:
          GH_TOKEN: ${{ github.token }}
          TRACE_ISSUES: ${{ runner.temp }}/nmp-behavior-issues.tsv
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          {
            git -C "$GITHUB_WORKSPACE" grep -h -E \
              '^[[:space:]]*#[[:space:]]*nmp:issue=#?[1-9][0-9]*[[:space:]]*$' \
              -- 'features/**/*.feature' || true
          } |
            sed -E 's/.*nmp:issue=#?([1-9][0-9]*).*/\1/' |
            sort -nu > nmp-behavior-issue-numbers
          printf 'nmp-behavior-issue-snapshot-v1\n' > "$TRACE_ISSUES"
          while IFS= read -r issue; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" \
              --jq 'if has("pull_request") then error("number names a pull request") else .state end')
            case "$state" in
              open|closed) printf '%s\t%s\n' "$issue" "$state" >> "$TRACE_ISSUES" ;;
              *) echo "issue #$issue returned unreadable state: $state" >&2; exit 1 ;;
            esac
          done < nmp-behavior-issue-numbers

      - name: Falsify detached target and repository Cargo-config isolation
        env:
          TRACE_CARGO_HOME: ${{ runner.temp }}/nmp-behavior-cargo-home
        working-directory: ${{ runner.temp }}
        run: >-
          bash "${{ github.workspace }}/tools/behavior-traceability/test-isolation.sh"
          "$TRACE_TOOLCHAIN"

      - name: Falsify the parser, status model, locators, issue state, and diff
        env:
          TRACE_CARGO_HOME: ${{ runner.temp }}/nmp-behavior-cargo-home
          TRACE_TARGET_DIR: ${{ runner.temp }}/nmp-behavior-target
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          CARGO_HOME="$TRACE_CARGO_HOME" \
          CARGO_TARGET_DIR="$TRACE_TARGET_DIR" \
            cargo "+$TRACE_TOOLCHAIN" test --locked \
              --manifest-path "$TRACE_MANIFEST"

      - name: Validate canonical behavior against explicit base and head trees
        env:
          TRACE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TRACE_CARGO_HOME: ${{ runner.temp }}/nmp-behavior-cargo-home
          TRACE_HEAD: ${{ github.sha }}
          TRACE_ISSUES: ${{ runner.temp }}/nmp-behavior-issues.tsv
          TRACE_TARGET_DIR: ${{ runner.temp }}/nmp-behavior-target
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          CARGO_HOME="$TRACE_CARGO_HOME" \
          CARGO_TARGET_DIR="$TRACE_TARGET_DIR" \
            cargo "+$TRACE_TOOLCHAIN" run --locked --quiet \
              --manifest-path "$TRACE_MANIFEST" -- \
              check --root "$GITHUB_WORKSPACE" \
              --base "$TRACE_BASE" --head "$TRACE_HEAD" \
              --issues "$TRACE_ISSUES"

  facade-acceptance:
    name: Deterministic public-facade acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain
        run: rustup show

      - name: Run Engine::new capstones against independent scripted relays
        run: cargo test -p nmp --features nip65 --test acceptance
