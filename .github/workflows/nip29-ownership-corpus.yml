# #1178: `scripts/check-nip29-ownership.sh` judges the corpus a clean checkout
# would have -- tracked files only -- so a stale gitignored uniffi binding
# cannot make it report a tombstone violation against text present in no
# tracked file and in no commit.
#
# This is its own top-level workflow file, mirroring `nip29-kind-blindness.yml`
# and `nip29-read-door.yml`, because `.github/workflows/architecture-gates.yml`
# -- where the gate itself runs -- is a protected path
# (`docs/internals/conventions/protected-path-signoff.md`), and a falsifier
# suite is not a governance migration.
#
# WHY IT HAS TO RUN AT ALL. The defect it falsifies can never occur here: the
# checkout is clean, so no stale artifact exists to be judged. That is exactly
# why the suite BUILDS the awkward corpus -- a stale binding, a deleted one, a
# path holding a space, one holding a newline, a tracked symlink, a submodule
# gitlink, a tracked file removed from the working tree -- instead of waiting
# for one to turn up. A gate whose failure mode is invisible to CI is a gate
# only local debugging pays for, and #1033 paid for this one twice.

name: NIP-29 ownership corpus

on:
  push:
    branches: [master]
  pull_request:

# Every step runs through one hardened shell (#1170). GitHub's default `run:`
# shell honours BASH_ENV, $ENV, profile files, and shell functions inherited
# from the environment, so the command a step names is not necessarily the
# command that runs -- a step can report success having executed something
# else while the workflow text still reads correctly. `-p` makes bash ignore
# all four; `--noprofile --norc` covers the startup files; `-eo pipefail`
# keeps a failure anywhere in a step fatal.
defaults:
  run:
    shell: bash --noprofile --norc -p -eo pipefail {0}

jobs:
  nip29-ownership-corpus:
    name: The NIP-29 ownership gate judges tracked files only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The suite mutates the working tree and puts every managed path back
      # from a copy taken first; it asserts, at the end, that the tree is
      # exactly as it found it. It runs the gate many times, so it subsumes a
      # plain green run of it.
      - name: The gate's corpus is what a clean checkout holds, and it still bites
        run: scripts/test-check-nip29-ownership.sh
