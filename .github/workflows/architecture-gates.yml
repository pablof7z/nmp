# Architecture review gates -- the mechanical checks from
# docs/design/architecture-review-gates.md (issue #496):
#
#   gate 5  Cross-SDK parity: the hand-written Swift and Kotlin SDK surfaces
#           must both cover every concept the Rust FFI exports
#           (scripts/check-sdk-parity.sh + its documented allowlist).
#   gate 6  Falsifier honesty: every symbol/path a PR's "Updated falsifiers"
#           field or "Falsifiers" section concretely names must exist in the
#           tree the PR produces (scripts/check-falsifier-honesty.sh).
#
# Alongside them live narrow, per-boundary structural checks that enforce one
# specific ownership contract each (currently #863's NIP-51 observational
# parsing rule and #879's pure content/locator boundary). Same character, same
# trust properties.
#
# This is a separate workflow file on purpose: .github/workflows/ci.yml is a
# protected surface-governance program (scripts/check-surface-governance.sh
# rejects ordinary-PR edits to it), while these checks require no secrets and
# make no pull_request_target trust decisions -- an ordinary reviewable
# workflow is the right home.
#
# Gates 5 and 6 are intended to be branch-protection REQUIRED checks (an
# owner/admin setting; see the gate doc). Every job here gates on content only
# and never executes PR-provided code beyond these repo scripts.

name: Architecture gates

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust-toolchain-reproducibility:
    name: Reproducible Rust toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the exact repository Rust toolchain
        run: rustup show

      - name: Match compiler, Cargo, Clippy, and rustfmt to the committed oracle
        run: bash scripts/check-rust-toolchain.sh

      - name: Falsify floating, mismatched, and incomplete pins
        run: bash scripts/test-rust-toolchain.sh

  tool-requirements:
    name: Verification tools fail closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse success when a checker dependency is absent
        run: bash scripts/test-check-tool-requirements.sh

  sdk-parity:
    name: Cross-SDK parity (gate 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Diff each component's Swift/Kotlin vocabulary against its Rust FFI surface
        run: bash scripts/check-sdk-parity.sh

  # #879: NIP-19/NIP-21 decoding preserves exact authored locator data and
  # must never regain engine, acquisition-policy, or compatibility-planner
  # ownership.
  content-parser-boundary:
    name: Pure content/locator boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain
        run: rustup show

      - name: Install the content-boundary checker's search tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Forbid acquisition policy and engine dependencies in locator parsing
        run: bash scripts/check-content-parser-boundary.sh

  # #863: NIP-51 Simple-groups parsing is tolerant/observational, and the two
  # withdrawn shapes (an authoritative-sounding `decode_*` door and a public
  # observation-qualified `ObservedSimpleGroupsList`) must be excluded by a
  # mechanism, not by reviewer memory. Same "plain shell over repo content,
  # no toolchain, no secrets" character as the two gates above.
  nip51-no-derived-authority:
    name: NIP-51 observational parsing (no derived authority)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Forbid derived NIP-51 authority and authoritative-sounding parser names
        run: bash scripts/check-nip51-no-derived-authority.sh

  # #816: an EVENT persistence failure revokes only the exact request owners
  # named by its relay session and wire FIFO. Ordinary EOSE and NIP-77
  # completion share one atomic coverage door; the process-wide degradation
  # diagnostic remains observational.
  request-coverage-authority:
    name: Request-scoped coverage authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Keep request poison scoped and coverage persistence single-door
        run: bash scripts/check-request-coverage-authority.sh

  # #838: NIP-29 contributes group context to a complete draft whose kind and
  # schema it does not own; NIP-C7 independently owns kind:9/q replies; client
  # mention and notification policy belongs to neither protocol module.
  nip29-ownership:
    name: NIP-29 exact context ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Keep NIP-29 context separate from C7 and client policy
        run: bash scripts/check-nip29-ownership.sh

  # NMP keeps no backwards compatibility: a replaced spelling is deleted in the
  # same change. There are no external consumers, so compatibility is a tax
  # paid to strangers who do not exist.
  no-compatibility-surface:
    name: No compatibility surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse a declared deprecation
        run: bash scripts/check-no-compatibility-surface.sh

  nip46-provider-boundary:
    name: NIP-46 optional provider boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Falsify provider workflow ownership
        run: |
          bash scripts/test-nip46-provider-change-routing.sh
          bash scripts/test-nip46-provider-workflow.sh

      - name: Keep NIP-46 out of core signer and native artifacts
        run: bash scripts/check-nip46-provider-boundary.sh

  ffi-facade-boundary:
    name: FFI consumes the canonical nmp facade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Keep nmp-ffi off direct mechanism-crate edges
        run: bash scripts/check-ffi-facade-boundary.sh

  # A 600-line hard cap per file, scoped to crates/nmp-bdd. The cap was a norm
  # before it was a check, which is how that tree's `world.rs` reached 1,333
  # lines; the script's own header records why the scope is this one crate and
  # not the workspace (97 of 299 tracked .rs files are over the cap today).
  bdd-file-length:
    name: BDD file-length cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Keep every crates/nmp-bdd file under 600 lines
        run: bash scripts/check-bdd-file-length.sh

  macos-ci-throughput:
    name: macOS CI throughput contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Falsify runner ownership, suite coverage, and cancellation isolation
        run: bash scripts/test-macos-ci-throughput.sh

  # #1074: canonical behavior stays organized by domain while executable
  # evidence stays with its contract owner. This separate lane validates both
  # maps without making the transitional nmp-bdd runner their authority.
  behavior-traceability:
    name: Behavioral status and evidence traceability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      TRACE_MANIFEST: ${{ github.workspace }}/tools/behavior-traceability/Cargo.toml
      TRACE_TOOLCHAIN: nightly-2026-07-07
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the exact trusted checker toolchain
        working-directory: ${{ runner.temp }}
        run: rustup toolchain install "$TRACE_TOOLCHAIN" --profile minimal

      # This protected workflow step reads untrusted feature text only as data.
      # The token is scoped to this step and never reaches the head-built Rust
      # checker. The snapshot is sorted, deduplicated, and exact.
      - name: Resolve governed issue state without exposing credentials to head code
        env:
          GH_TOKEN: ${{ github.token }}
          TRACE_ISSUES: ${{ runner.temp }}/nmp-behavior-issues.tsv
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          {
            git -C "$GITHUB_WORKSPACE" grep -h -E \
              '^[[:space:]]*#[[:space:]]*nmp:issue=#?[1-9][0-9]*[[:space:]]*$' \
              -- 'features/**/*.feature' || true
          } |
            sed -E 's/.*nmp:issue=#?([1-9][0-9]*).*/\1/' |
            sort -nu > nmp-behavior-issue-numbers
          printf 'nmp-behavior-issue-snapshot-v1\n' > "$TRACE_ISSUES"
          while IFS= read -r issue; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" \
              --jq 'if has("pull_request") then error("number names a pull request") else .state end')
            case "$state" in
              open|closed) printf '%s\t%s\n' "$issue" "$state" >> "$TRACE_ISSUES" ;;
              *) echo "issue #$issue returned unreadable state: $state" >&2; exit 1 ;;
            esac
          done < nmp-behavior-issue-numbers

      - name: Falsify detached target and repository Cargo-config isolation
        env:
          TRACE_CARGO_HOME: ${{ runner.temp }}/nmp-behavior-cargo-home
        working-directory: ${{ runner.temp }}
        run: >-
          bash "${{ github.workspace }}/tools/behavior-traceability/test-isolation.sh"
          "$TRACE_TOOLCHAIN"

      - name: Falsify the parser, status model, locators, issue state, and diff
        env:
          TRACE_CARGO_HOME: ${{ runner.temp }}/nmp-behavior-cargo-home
          TRACE_TARGET_DIR: ${{ runner.temp }}/nmp-behavior-target
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          CARGO_HOME="$TRACE_CARGO_HOME" \
          CARGO_TARGET_DIR="$TRACE_TARGET_DIR" \
            cargo "+$TRACE_TOOLCHAIN" test --locked \
              --manifest-path "$TRACE_MANIFEST"

      - name: Validate canonical behavior against explicit base and head trees
        env:
          TRACE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TRACE_CARGO_HOME: ${{ runner.temp }}/nmp-behavior-cargo-home
          TRACE_HEAD: ${{ github.sha }}
          TRACE_ISSUES: ${{ runner.temp }}/nmp-behavior-issues.tsv
          TRACE_TARGET_DIR: ${{ runner.temp }}/nmp-behavior-target
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          CARGO_HOME="$TRACE_CARGO_HOME" \
          CARGO_TARGET_DIR="$TRACE_TARGET_DIR" \
            cargo "+$TRACE_TOOLCHAIN" run --locked --quiet \
              --manifest-path "$TRACE_MANIFEST" -- \
              check --root "$GITHUB_WORKSPACE" \
              --base "$TRACE_BASE" --head "$TRACE_HEAD" \
              --issues "$TRACE_ISSUES"

  falsifier-honesty:
    name: Falsifier honesty (gate 6)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The PR body is untrusted text. It reaches the script only as a file
      # via an env var (never shell-interpolated), and the script only ever
      # greps it.
      - name: Capture PR body as claim text
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Verify named falsifiers/mechanisms exist in the PR tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-falsifier-honesty.sh "$BASE_SHA" HEAD "$RUNNER_TEMP/pr-body.md"
