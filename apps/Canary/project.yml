# The Canary -- xcodegen project spec (committed; the generated
# .xcodeproj is NOT committed, see repo .gitignore / memory
# xcodegen-pbxproj-churn: xcodegen churns pbxproj UUIDs on every regen).
#
# Regenerate with: (cd apps/Canary && xcodegen generate)
#
# The real-relay scenario suite (docs/internals/canary.md's C1-C18) does
# NOT live here. It's `apps/Canary/CanaryScenarios`, a standalone SwiftPM
# package run with plain `swift test` -- no xcodegen, no xcodebuild, no
# simulator. This project spec is the iOS app only: does it compile,
# does it feel like an ordinary app someone would write. `RelayLabKit`
# (docs/internals/canary.md "Where the controller lives") is consumed
# from CanaryScenarios, not from here -- `Process`/child-process spawning
# does not exist on the iOS SDK at all, so it could never link into an
# iOS target anyway.
name: Canary
options:
  bundleIdPrefix: com.nmp.canary
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  NMP:
    path: ../../Packages/NMP
targets:
  Canary:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Canary
    dependencies:
      - package: NMP
        product: NMP
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Canary
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nmp.canary
        TARGETED_DEVICE_FAMILY: "1"
  CanaryTests:
    # #1429: runtime-qualify a public-hostname NIP-11 acquisition through the
    # supported Swift facade on an actual iOS Simulator process.
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/CanaryTests
    dependencies:
      - target: Canary
      - package: NMP
        product: NMP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nmp.canary.tests
