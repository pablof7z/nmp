[package]
name = "nmp-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Store-owned corruption fixtures used by integration tests in other crates.
# Normal engine and native builds do not compile these destructive helpers.
test-instrumentation = []
# Opt-in counters for evidence binaries. Kept out of production builds so the
# query hot path pays no atomic-increment cost merely to support benchmarks.
# Being absent from every production build is not being absent from every
# build: .github/workflows/optional-features.yml compiles and tests this
# feature on every pull request (#1268), because a feature no job enables is a
# feature nothing can hold to the standard the rest of the crate is held to.
bench-instrumentation = ["dep:fjall", "dep:heed"]

[[example]]
name = "scale_bench"
required-features = ["bench-instrumentation"]

[[example]]
name = "store_decomposition"
required-features = ["bench-instrumentation"]

[[example]]
name = "redb_index_layout"
required-features = ["bench-instrumentation"]

[[example]]
name = "packed_postings"
required-features = ["bench-instrumentation"]

[dependencies]
nostr.workspace = true
nmp-grammar.workspace = true
# Redb is the one complete `EventStore` implementation. It is a pure-Rust
# embedded ACID key-value store with no C toolchain or build script.
redb = "4.1"
fjall = { version = "=3.1.6", optional = true }
# Native-only LMDB ceiling adapter for #658. This remains benchmark-gated:
# production NMP and browser targets do not acquire a C build dependency.
heed = { version = "=0.22.1", optional = true }
# `RedbStore` canonical event rows use a versioned portable binary envelope
# for borrowed query filtering. Durable-delivery control records use their own
# explicit binary codec; coverage and tombstone records remain typed serde JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
libc = "0.2"
syn = { version = "2", features = ["full", "visit"] }
wait-timeout = "0.2"
