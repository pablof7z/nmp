[package]
name = "nmp-parity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Product-level semantic parity harness for the direct Rust and FFI NMP facades."

[lib]
doctest = false

[dependencies]
nostr.workspace = true
nmp = { workspace = true, features = ["nip65"] }
nmp-ffi = { workspace = true, features = ["content", "nip02", "nip22", "nip29"] }
nmp-content.workspace = true
nmp-grammar.workspace = true
nmp-nip22.workspace = true
# #1707: neither NIP-02 nor NIP-29 is an `nmp` feature any more -- the
# direct-Rust side of this parity harness names each explicitly, same as
# any other consumer.
nmp-nip02.workspace = true
nmp-nip29.workspace = true

[dev-dependencies]
nmp-test-support.workspace = true
nmp-store.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# #99: the terminal-retained-receipt reattach scenario needs a real
# `RedbStore` file (an ephemeral receipt abandoned across a genuine
# close/reopen), not the engine-owned temporary Redb path.
tempfile = "3"
