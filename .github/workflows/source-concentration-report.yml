# #1561: production/test/documentation/generated line counts per file and
# per workspace package, with review triggers at 500/1,000/1,500 non-test
# lines and a flag for packages under ~250 production lines. It gives
# #1496's own completion criterion (those four line classes measured
# separately) a tool instead of hand-counting.
#
# WHY THIS IS NOT A `pull_request`/`push` JOB IN architecture-gates.yml. It
# was one, briefly, and was reverted: a non-blocking report that runs on
# every PR and writes only to a job's raw log is read by approximately
# nobody -- it is CI ceremony with no forcing function, not a review aid.
# The numbers that matter for a decomposition review are also fresher run
# locally against the branch actually being decomposed
# (`bash scripts/report-source-concentration.sh`) than anything a stale
# `master` CI run could show. This workflow exists for the case that
# genuinely wants a shareable, no-checkout-required snapshot: manual
# (`workflow_dispatch`) or a weekly drift check, both writing a legible
# `GITHUB_STEP_SUMMARY` instead of a raw log.
#
# Same "content-only, no secrets, no PR-provided code" trust character as
# architecture-gates.yml; see that file for the shared hardened-shell
# rationale (#1170) this workflow repeats below.

name: Source concentration report

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # weekly drift check, Monday 06:00 UTC

defaults:
  run:
    shell: bash --noprofile --norc -p -eo pipefail {0}

jobs:
  report:
    name: Production/test/documentation/generated lines per file and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain
        run: rustup show

      - name: Report production/test/documentation/generated lines per file and package
        run: |
          {
            echo "## Source concentration report (#1561)"
            echo
            echo '```'
            bash scripts/report-source-concentration.sh
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
