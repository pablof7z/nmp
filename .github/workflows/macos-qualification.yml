# One macOS runner owns native Apple qualification for a pull-request head.
# Pull requests build only the host slice needed by SwiftPM/XCTest. The
# less-frequent master run packages the full device + simulator + macOS set.
name: macOS qualification

on:
  push:
    branches: [master]
  pull_request:

# GitHub concurrency groups are repository-wide. Workflow and event identity
# keep unrelated workflows and PR-vs-push runs isolated; the PR number (falling
# back to the full ref for non-PR events) makes a newer run supersede only the
# older run with the same owner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-qualification:
    name: macOS qualification
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Select thin PR or full master Apple scope
        id: apple_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            echo "mode=--macos-only" >> "$GITHUB_OUTPUT"
            echo "targets=aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
          else
            echo "mode=" >> "$GITHUB_OUTPUT"
            echo "targets=aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
          fi

      - name: Add selected Apple targets
        run: rustup target add ${{ steps.apple_scope.outputs.targets }}

      # Core and the optional provider must come from one Cargo resolution
      # unit. The paired builder compiles that unit once per selected target,
      # then packages both XCFrameworks from the same sealed snapshots.
      - name: Build matched core and NIP-46 provider XCFrameworks once
        id: apple_components
        run: scripts/build-swift-nip46-xcframework.sh ${{ steps.apple_scope.outputs.mode }}

      - name: Build the Swift package
        id: swift_package
        if: ${{ !cancelled() && steps.apple_components.outcome == 'success' }}
        run: swift build
        working-directory: Packages/NMP

      - name: Test the Swift package
        if: ${{ !cancelled() && steps.swift_package.outcome == 'success' }}
        run: swift test
        working-directory: Packages/NMP

      # These archive-local maps took 11 seconds in the measured baseline.
      # Uploading the much larger XCFrameworks merely to run the same
      # strings/nm checks on Ubuntu would consume more exclusive Mac time.
      - name: Prove identity and clean inventory for every packaged slice
        if: ${{ !cancelled() && steps.apple_components.outcome == 'success' }}
        run: |
          while IFS= read -r matched_core; do
            relative_path=${matched_core#Packages/NMP/NMP.xcframework/}
            slice_directory=${relative_path%/libnmp_ffi.a}
            matched_provider=Packages/NMPNip46/NMPNip46.xcframework/$slice_directory/libnmp_nip46_ffi.a
            test -f "$matched_provider"
            scripts/check-nip46-component-identity.sh \
              --matched-only \
              "$matched_core" \
              "$matched_provider"
            scripts/check-nip46-artifact-inventory.sh \
              "$matched_core" \
              "$matched_provider" \
              Packages/NMP/Sources/NMPFFI \
              Packages/NMPNip46/Sources/NMPNip46FFI
          done < <(
            find Packages/NMP/NMP.xcframework -type f -name libnmp_ffi.a |
              sort
          )

      - name: Test the selectable NIP-46 provider package
        if: ${{ !cancelled() && steps.apple_components.outcome == 'success' }}
        run: swift test
        working-directory: Packages/NMPNip46
