[package]
name = "nmp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

# #52 Q3 (Fable checkpoint): the ONLY sanctioned way to inject a pre-built
# store plus a static neutral fact snapshot, needed by `nmp-bdd` (spawns the
# real `EngineThread` against scripted in-process relays). Off by default; enabling
# it in a consumer's `Cargo.toml` is a greppable, reviewable line -- a
# stability exception, not a security one (the acceptance-boundary verify in
# `crate::core` covers every path regardless, Unit A0/#56).
# `nmp-router-testkit` (#1667) is the fixture-facts crate every constructor
# this feature unlocks takes -- optional and pulled in ONLY by this feature,
# so a default-features consumer never links a test-fixture crate.
unstable-mechanism = [
    "dep:nmp-router-testkit",
    "nmp-engine/unstable-mechanism",
    "nmp-runtime/unstable-mechanism",
]

# #1707's NIP-65 reversal is FINISHED. The last exception was this crate's
# `nip65` feature, which turned on `nmp-runtime`'s hard-wired outbox
# discovery glue -- "how the engine performs ITS OWN job of discovering an
# author's relays" was the argument, and it did not survive the owner's
# requirement that a third party be able to supply a different algorithm.
# Author-route discovery is an `AuthorRouteProvider` an application
# constructs and hands to `Engine::new_with_capabilities_and_routing`, same
# as every capability. The feature, and the whole cfg-shape break class that
# came with it, are deleted.

# #1707 deleted the `nip29`/`nip22`/`nip25`/`nip18`/`nipc7`/`content`
# features and their `dep:nmp-*` optional dependencies below.
# `nip22`/`nip25`/`nip18`/`nipc7`/`content`
# were pure re-export doors with no engine coupling at all. `nip29` was not a
# bare re-export door -- its Group/Groups/group-list-write door genuinely
# needed `nmp`'s engine surface -- but that need runs the OTHER way: the
# capability crate composes the engine it runs against, not the reverse, so
# `nmp-nip29` now depends on `nmp` instead of the facade re-exporting
# `nmp-nip29`. A direct-Rust app names the mechanism crate directly, same as
# `nmp-ffi`/Swift/Kotlin already do and same as `nmp-nip02`
# already works. `nmp` must not contain a single line of any capability's
# meaning, re-export door or not.

# #827: both instrumentation features came in with the folded engine modules
# (`core`, `runtime`, `outbox`). They stay non-default.
bench-instrumentation = [
    "nmp-engine/bench-instrumentation",
    "nmp-runtime/bench-instrumentation",
]
test-instrumentation = [
    "nmp-engine/test-instrumentation",
    "nmp-runtime/test-instrumentation",
    "nmp-store/test-instrumentation",
    "nmp-nip11/test-instrumentation",
]

[[example]]
name = "incremental_delta_bench"
required-features = ["bench-instrumentation"]

[[example]]
name = "local_mutation_delta_bench"
required-features = ["bench-instrumentation"]

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"

[dependencies]
nostr.workspace = true
nmp-grammar.workspace = true
nmp-signer.workspace = true
nmp-local-signer.workspace = true
# The deterministic reducer (#1707). It left this crate so its own manifest
# could be the proof that `EngineCore` links no async runtime and no HTTP
# client -- a claim this crate's `Cargo.toml`, which names `tokio`, cannot
# make about a module inside itself.
nmp-engine.workspace = true
# The async edge. `nmp` assembles and projects; it interprets no effects
# itself, which is why `crossbeam-channel` is no longer named in this
# manifest. `tokio` stays, but only for the two places the FACADE itself
# touches it: `Engine::adapter_runtime()`, which hands a protocol adapter the
# engine's own runtime handle, and `nip29::records`' await timeout.
nmp-runtime.workspace = true
nmp-store.workspace = true
nmp-router.workspace = true
nmp-router-testkit = { workspace = true, optional = true }
nmp-transport.workspace = true
# NIP-11 relay information: the values an app reads and the one-shot HTTP
# acquisition service the runtime drives. It is a crate, not a module here,
# because the boundary needs manifest-level proof -- `reqwest` and `httpdate`
# are named by that package and by nothing else in this tree, so `EngineCore`
# links no HTTP client. The reducer consumes the projection
# (`core::RelayInformationCapabilityEvidence`) that `runtime` maps a snapshot
# into; it never names this crate's types.
nmp-nip11.workspace = true
blake3.workspace = true
# The opaque session payload's hex round-trip in `engine/session.rs`.
hex = "0.4"
# #704: the engine owns ONE multi-thread tokio runtime (2 workers) that hosts
# every adapter task (NIP-11 fetches, signer/AUTH completion awaits, optional
# provider sessions, follow-action acquisition) -- replacing the deleted
# internal blocking-adapter executor. `rt-multi-thread` is therefore a
# production feature now, not a dev-only one. `Engine::adapter_runtime()`
# hands protocol adapters that same runtime handle; only the `Handle` type
# crosses the facade boundary.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "sync"] }

[dev-dependencies]
# `unstable-mechanism`: every headless/`_headless.rs` and `core_headless/`
# integration test seeds its `EngineCore`/`EngineThread` through the gated
# fixture constructors (#1665, #1667) -- this crate's own test targets are
# their only in-workspace callers.
nmp = { path = ".", features = ["test-instrumentation", "unstable-mechanism"] }
# Dev-only: several tests need a REAL author-route provider to install --
# `acceptance/` observes a cold engine discovering Alice's relays, and
# `semantic_delivery_witnesses.rs` needs a discovered outbox to prove a write
# never reaches it. The NIP-65 outbox algorithm is the one this workspace
# ships; nothing in `nmp` itself names it, which is the whole point.
nmp-outbox.workspace = true
# The headless reducer corpus (`tests/core_headless/`) and the runtime
# integration tests drive `EngineCore`/`EngineThread` directly. They reached
# them through the deleted `mechanism` basement; they name the packages now.
nmp-engine = { workspace = true, features = ["test-instrumentation", "unstable-mechanism"] }
nmp-runtime = { workspace = true, features = ["test-instrumentation", "unstable-mechanism"] }
# #1707: `optimistic_publish.rs` uses NIP-29's write door as one of two
# vehicles for a claim that is otherwise general (#1182) -- it is not a
# NIP-29-door proof itself (that moved to `nmp-nip29/tests/` with the door),
# so it stays here and reaches the capability the ordinary way, through this
# crate's own dev-dependencies.
nmp-nip29.workspace = true
nmp-test-support.workspace = true
nmp-resolver-testkit.workspace = true
# #1731: these were declared as production dependencies with zero uses in
# `crates/nmp/src`. They are real, and test-only: the relay-ingest probe under
# `examples/support/` names `nmp-resolver`, `serde_json` and `libc`.
# A manifest that claims a production edge it does not have is
# corrosive precisely because manifest-as-proof is what the crate split rests
# on.
nmp-resolver.workspace = true
serde_json.workspace = true
nmp-router-testkit.workspace = true
nmp-store = { workspace = true, features = ["test-instrumentation"] }
cucumber = "0.21"
# In-process test relay for the runtime (C) integration tests: reconnection
# replay (test 6) and the end-to-end subscribe/publish/reconnect drive.
# Async under the hood (nostr-sdk); confined to dev-dependencies and
# `#[tokio::test]` -- the production `EngineThread`/`Pool` stay free of any
# imposed runtime (D8). Mirrors `nmp-transport`'s own dev-dependency set
# (see that crate's `tests/mock_relay.rs` for the same version-shadowing
# gotcha noted below).
nostr-relay-builder = "0.45.0-alpha.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `watermark_cold_start_offline` (integration_capstone.rs) needs a real
# on-disk `RedbStore` file it can close and reopen across a simulated
# restart -- a throwaway temp dir per test run, same crate `nmp-store`
# already uses for its own `RedbStore` tests.
tempfile = "3"
# The relay-ingest probe under `examples/support/` reads
# `CLOCK_MONOTONIC_RAW` and calls `malloc_trim` directly. Already resolved
# transitively (mio/tokio/etc.) at the SAME pinned version -- this just names
# it directly for the code that calls it.
libc = "0.2"
# `integration_capstone.rs` and the `examples/` probes speak the WebSocket
# wire directly. Same version `nmp-transport`'s own production `Pool` speaks
# (already resolved workspace-wide); this just names it directly for the
# tests that need to speak it from the SERVER side.
tungstenite = "0.29"
serde = { version = "1", features = ["derive"] }
url = "2"
