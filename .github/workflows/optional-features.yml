# #1268: code behind a non-default Cargo feature is invisible to a build that
# never enables it. `cargo test --workspace` — the only Rust suite CI ran —
# enables a workspace member's feature exactly when some other workspace
# member's dependency edge asks for it, and nothing asks for
# `bench-instrumentation`. Six `nmp-store` modules therefore compiled nowhere
# in CI, and #1260 shipped a `nmp-store` that did not build at all under the
# feature; master stayed green until a human tried it by hand. The two test
# failures #1268 also fixes had been red for an unknowable length of time,
# because a feature no job builds leaves no CI history to read.
#
# The gate is `--all-features`, not `--features bench-instrumentation`, on
# purpose. Naming the feature would fix today's hole and rebuild it for the
# next non-default feature nobody remembers to add here — a hand-maintained
# list of what CI covers is the same defect one level up. `--all-features` is
# enumerated by Cargo from the manifests, so a feature added tomorrow is
# covered by its author writing the manifest entry and nothing else.
#
# This does NOT weaken why `bench-instrumentation` is opt-in
# (`crates/nmp-store/Cargo.toml`): its atomic counters stay out of the default
# build, which is what "kept out of production builds" asks for. Being absent
# from every *production* build and absent from every *build* are different
# claims, and only the first was ever justified.
#
# This is its own workflow file because .github/workflows/ci.yml and
# .github/workflows/architecture-gates.yml are exact protected paths of the
# surface-governance migration policy
# (scripts/check-surface-migration-authorization.py), and this job needs
# neither owner authorization nor any secret: it runs Cargo over repository
# content and executes no PR-provided code beyond the crates it compiles.
# Same reasoning and same shape as dependency-direction.yml (#922) and
# routing-vocabulary.yml (#1105). Triggers match ci.yml's so the feature-on
# build runs on every pull request and every push to master.

name: Optional features

on:
  push:
    branches: [master]
  pull_request:

jobs:
  all-features:
    name: Every optional feature compiles and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Installs the exact toolchain (channel + components) pinned by
      # rust-toolchain.toml at the repo root.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: cargo clippy (workspace, all features, all targets, deny warnings)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: cargo test (workspace, all features)
        run: cargo test --workspace --all-features
