[package]
name = "nmp-consumer-check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The point of this crate: every GENERIC engine/query/write/diagnostics noun
# below is reachable from `nmp` alone -- not even `nostr` directly, since
# every such value type is reached through `nmp`'s own re-exports. If a
# caller ever needs a second `use` line naming a mechanism crate or `nostr`
# itself for one of THOSE nouns, the facade's re-export inventory has a gap
# -- this crate existing and compiling IS the acceptance proof for #52's "an
# app's Cargo.toml names `nmp` alone" for the engine surface, not for any
# one capability's meaning.
#
# Every capability below is a SEPARATE, EXPLICIT dependency line, not a
# facade feature: #1707 finished what #1143's NIP-02 reversal and #1563's
# media reversal started -- `nmp` must not contain a single capability's own
# meaning, re-export door or not (NIP-22/25/18/NIP-C7/content/asset/blossom
# were pure re-export doors with no engine coupling at all, deleted here;
# NIP-29 stays a facade feature only because its own reversal, #1707 step 4,
# has not landed yet). A direct-Rust app that wants any of these names the
# capability's own crate alongside `nmp` -- the uniform two-crate cost every
# capability now pays for direct-Rust reach. This crate names each
# explicitly rather than pretending the whole workspace collapses into one
# `Cargo.toml` line; that pretense is exactly what #1707 falsifies.
[dependencies]
nmp = { workspace = true, features = ["nip29"] }
nmp-nip02.workspace = true
nmp-nip18.workspace = true
nmp-nip22.workspace = true
nmp-nip25.workspace = true
nmp-nipc7.workspace = true
nmp-content.workspace = true
nmp-asset.workspace = true
nmp-blossom.workspace = true
