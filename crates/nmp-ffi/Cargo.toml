[package]
name = "nmp-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# M4 plan §2: staticlib for the iOS xcframework, plain lib for the round-trip
# unit tests / the `uniffi-bindgen` bin target below to link against. cdylib
# added for #40 (Kotlin/Flow falsifier) -- UniFFI's Kotlin bindings load the
# core through JNA, which needs a dynamic library (JVM has no static-linking
# story); Swift's own build path (scripts/build-swift-xcframework.sh) still
# only ever asks cargo for the staticlib slices, so this is additive and
# Swift-neutral.
[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "nmp_ffi"

[features]
default = []

# #824: these are the stable app-facing selection keys consumed by the native
# feature manifest. Each key only forwards into its real Cargo dependency;
# Cargo remains the sole dependency graph.
nip02 = ["dep:nmp-nip02", "nip65"]
nip18 = ["nmp/nip18"]
nip22 = ["nmp/nip22", "nip65"]
nip25 = ["nmp/nip25"]
nip29 = ["nmp/nip29"]
nip65 = ["nmp/nip65"]
nipc7 = ["nmp/nipc7"]
asset = ["nmp/asset"]
blossom = ["nmp/blossom", "asset"]
content = ["nmp/content"]

# `cargo run -p nmp-ffi --bin uniffi-bindgen generate --library <staticlib> \
#   --language swift --out-dir gen/` (M4 plan §3 step 3, library mode -- reads
# exported metadata straight from the compiled staticlib, no .udl file).
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
nostr.workspace = true
# #851: every engine, query, receipt, signer and typed write value this crate
# projects is reached through the canonical `nmp` facade -- `nmp-grammar` and
# `nmp-signer` are transitive implementation detail behind it, not direct
# normal edges. `nmp-ffi` is the ONE staticlib/cdylib every Swift and Kotlin
# app links, so a direct mechanism edge here would let the native product
# boundary bind a type the facade never projected or governed.
#
# The feature list is how this crate reaches every optional protocol and
# content family (#572/#907 for NIP-22, #1239 for the rest): one owner, turned
# on, rather than a second edge to the mechanism crate alongside the facade.
# `scripts/check-ffi-facade-boundary.sh` is the mechanism that keeps all of
# this true.
#
# Before #1239 these were direct edges here and nowhere in the facade, on the
# reasoning that they are "app-chosen protocol modules, not engine/query/
# signer/write concepts the canonical facade governs". That reasoning decided
# what `nmp-ffi` may BIND and never what the facade must OFFER, so it left the
# families reachable from Swift and not from direct Rust. Now that the facade
# offers each one, a direct edge here would be a second owner of the same
# values -- exactly what #851 closed for `nmp-nip22`.
nmp = { workspace = true }
uniffi = { workspace = true, features = ["cli"] }
zeroize = "1"
k256 = { version = "0.13.4", default-features = false }
# The ONE family that cannot come through the facade: `nmp-nip02` depends on
# `nmp` (a `protocol-service` in `scripts/dependency-direction-policy.json`,
# above the facade rather than below it), so `nmp -> nmp-nip02` is a cyclic
# package dependency cargo refuses to resolve. #1239 records this as its own
# unit of work: the follow service's engine coupling has to be inverted before
# the facade can own its vocabulary. Until then this edge is the only way the
# staticlib every Swift and Kotlin app links can project the follow door.
nmp-nip02 = { workspace = true, optional = true }
# #555: `FfiBlossomAuthorization::validate_signed_event` reassembles an
# `FfiSignedEvent` record into canonical event JSON for nostr's strict
# `Event::from_json` parser (typed refusal on malformed id/sig hex).
serde_json.workspace = true
# #555: `FfiBlossomClient`'s blocking methods each drive the async
# `nmp-blossom` client on a per-call current-thread runtime (the engine's
# `relay_information.rs` `http_runtime()` discipline). Same production
# feature set as nmp-engine's own tokio dependency, minus `sync`.
tokio = { version = "1", features = ["rt", "time", "net"] }

# #99/#920: store-owned test-instrumentation fixtures corrupt the exact
# retained receipt and create the markerless schema witness without exposing
# Redb types or tables here.
[dev-dependencies]
# #851/#934: the ONE mechanism value this crate still reaches for, and only
# from `#[cfg(test)]`. `nmp` re-exports `ShortfallFact`, whose
# `NoPlannedSource`/`LocalLimit` variants carry an `atom: ConcreteFilter`
# field the facade does not project -- so the acquisition-evidence falsifier
# cannot build its own fixture atom through `nmp` alone. Filed as #934. A
# dev-dependency is not a production edge: `cargo build -p nmp-ffi` cannot
# resolve `nmp_grammar::` at all, so the compiler itself proves the
# staticlib/cdylib binds nothing from it.
nmp-grammar.workspace = true
nmp-test-support.workspace = true
nmp-store = { workspace = true, features = ["test-instrumentation"] }
tempfile = "3"
tungstenite = "0.29"
url = "2"
# #680 async observation falsifiers drive the pull-based `next()` futures with a
# real executor. `#[tokio::test]` only, dev-only — production stays runtime-free.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
