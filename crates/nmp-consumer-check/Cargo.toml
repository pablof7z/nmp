[package]
name = "nmp-consumer-check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The point of this crate: every GENERIC engine/query/write/diagnostics noun
# below is reachable from `nmp` alone -- not even `nostr` directly, since
# every such value type is reached through `nmp`'s own re-exports. If a
# caller ever needs a second `use` line naming a mechanism crate or `nostr`
# itself for one of THOSE nouns, the facade's re-export inventory has a gap
# -- this crate existing and compiling IS the acceptance proof for #52's "an
# app's Cargo.toml names `nmp` alone" for the engine surface, not for any
# one capability's meaning.
#
# Every capability below is a SEPARATE, EXPLICIT dependency line, not a
# facade feature: #1707 finished what #1143's NIP-02 reversal started --
# `nmp` must not contain a single capability's own
# meaning, re-export door or not (NIP-22/25/18/NIP-C7/content
# were pure re-export doors with no engine coupling at all; NIP-29's own
# Group/group-list-write door genuinely needed the engine, but that need
# runs `nmp-nip29 -> nmp`, not the reverse, same as every other capability
# here). A direct-Rust app that wants any of these names the capability's
# own crate alongside `nmp` -- the uniform two-crate cost every capability
# now pays for direct-Rust reach. This crate names each explicitly rather
# than pretending the whole workspace collapses into one `Cargo.toml` line;
# that pretense is exactly what #1707 falsifies.
#
# NIP-65 is no longer the exception it used to be. Its routing half was the
# last thing reachable only as an `nmp` feature; it is `nmp-outbox` now --
# an `AuthorRouteProvider` implementation an application names and passes to
# `Engine::new_with_capabilities_and_routing`, exactly like every capability
# line below.
[dependencies]
nmp.workspace = true
nmp-outbox.workspace = true
nmp-nip02.workspace = true
nmp-nip18.workspace = true
nmp-nip22.workspace = true
nmp-nip25.workspace = true
nmp-nip29.workspace = true
nmp-nipc7.workspace = true
nmp-content.workspace = true
