# #1310: skills/nmp/SKILL.md's Verified-Revision pin records that the
# skill's declared sources (skills/nmp/references/source-map.md) were
# audited as of a specific commit. Nothing enforced that claim: `grep -rn
# skill .github/workflows/` returned zero hits, and neither
# skills/nmp/scripts/validate_skill.py nor its unit tests
# (skills/nmp/tests/test_validate_skill.py) ran anywhere. #1177 found the
# pin 332 commits stale, on a commit that was not even an ancestor of
# master, before anyone noticed. This workflow is the gate that makes the
# next drift visible the moment it happens instead of hundreds of commits
# later.
#
# The bundled validator also runs an *official* skill-creator packaging
# check (agents/openai.yaml shape, forbidden files, etc.) through a
# workstation/agent-local tool with no CI equivalent
# (~/.codex/skills/.system/skill-creator/scripts/quick_validate.py). #1310's
# own framing keeps that half a separate, workstation-only step; this
# workflow wires up only the currency check -- the pin's existence, its
# ancestry, and whether any declared source has drifted since it -- which
# does not depend on that tool.
#
# This is its own workflow so a drifted, deleted, or non-ancestor pin has a
# dedicated, easy-to-find check name. It runs two repository scripts over
# repository content, needs full commit history to compare the working tree
# against the pinned revision, uses no secret, and executes no PR-provided
# code beyond those two scripts.

name: Skill currency

on:
  push:
    branches: [master]
  pull_request:

# Every step runs through one hardened shell (#1170). GitHub's default `run:`
# shell honours BASH_ENV, $ENV, profile files, and shell functions inherited
# from the environment, so the command a step names is not necessarily the
# command that runs -- a step can report success having executed something
# else while the workflow text still reads correctly. `-p` makes bash ignore
# all four; `--noprofile --norc` covers the startup files; `-eo pipefail`
# keeps a failure anywhere in a step fatal.
defaults:
  run:
    shell: bash --noprofile --norc -p -eo pipefail {0}


jobs:
  skill-currency:
    name: nmp skill Verified-Revision currency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Falsify the validator's own rejection behaviour, including pin ancestry and source drift
        run: scripts/test-skill-currency.sh

      - name: Catch a drifted, deleted, or non-ancestor Verified-Revision pin
        run: scripts/check-skill-currency.sh
