name: Android emulator

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -p -eo pipefail {0}

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Runtime evidence is bound to the published PR head itself, not
          # GitHub's synthetic pull-request merge commit. Push runs retain
          # their ordinary event SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select ephemeral Android build paths
        run: |
          echo "NMP_ANDROID_RUNTIME_OUTPUT=$RUNNER_TEMP/nmp-android-runtime" >> "$GITHUB_ENV"
          echo "NMP_ANDROID_RUNTIME_CACHE=$RUNNER_TEMP/nmp-android-runtime-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android and Rust inputs
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install the NMP CLI and build the exact core-only AAR
        run: |
          cargo install --locked --path crates/nmp-cli
          nmp --manifest fixtures/android-aar-consumer/.nmp.toml prepare \
            --output "$NMP_ANDROID_RUNTIME_OUTPUT" \
            --cache-dir "$NMP_ANDROID_RUNTIME_CACHE"
          nmp --manifest fixtures/android-aar-consumer/.nmp.toml verify \
            --output "$NMP_ANDROID_RUNTIME_OUTPUT"
          scripts/verify-android-aar.py verify \
            --repo "$GITHUB_WORKSPACE" \
            --output "$NMP_ANDROID_RUNTIME_OUTPUT"
          cargo build --locked -p nmp-test-support --bin android_controlled_relay --release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run external Maven consumer on pinned API-35 emulator
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/test-android-emulator.sh

      - name: Publish emulator, artifact, APK, relay, and logcat evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nmp-android-emulator-evidence
          path: |
            artifacts/android-emulator
            ${{ runner.temp }}/nmp-android-runtime/android/artifacts/nmp-android-0.0.0.aar
            ${{ runner.temp }}/nmp-android-runtime/nmp-native-provenance.json
          if-no-files-found: warn
