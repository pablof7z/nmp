# One macOS runner owns native Apple qualification for a pull-request head.
# Pull requests build the simulator and host slices needed by SwiftPM/XCTest
# plus the public-hostname NIP-11 simulator falsifier. The less-frequent master
# run packages the full device + simulator + macOS set.
name: macOS qualification

on:
  push:
    branches: [master]
  pull_request:

# GitHub concurrency groups are repository-wide. Workflow and event identity
# keep unrelated workflows and PR-vs-push runs isolated; the PR number (falling
# back to the full ref for non-PR events) makes a newer run supersede only the
# older run with the same owner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every step runs through one hardened shell (#1170). GitHub's default `run:`
# shell honours BASH_ENV, $ENV, profile files, and shell functions inherited
# from the environment, so the command a step names is not necessarily the
# command that runs -- a step can report success having executed something
# else while the workflow text still reads correctly. `-p` makes bash ignore
# all four; `--noprofile --norc` covers the startup files; `-eo pipefail`
# keeps a failure anywhere in a step fatal.
defaults:
  run:
    shell: bash --noprofile --norc -p -eo pipefail {0}


jobs:
  macos-qualification:
    name: macOS qualification
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Select the newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          latest=${latest:-/Applications/Xcode.app}
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Select simulator PR or full master Apple scope
        id: apple_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            echo "mode=--sim-only" >> "$GITHUB_OUTPUT"
          else
            echo "mode=" >> "$GITHUB_OUTPUT"
          fi

      # The builder installs the Rust targets its selected slices need, on the
      # toolchain rust-toolchain.toml pins (#1240). A second target list here
      # would be a second owner of the same fact, and would hide a builder that
      # stopped installing them -- which is what a consumer clone hits.
      - name: Build the core XCFramework once
        id: apple_components
        run: |
          scripts/build-swift-xcframework.sh ${{ steps.apple_scope.outputs.mode }}
          [[ -f tools/nip29-consumer-swift/Package.swift ]] || exit 0
          case "$(uname -m)" in
            x86_64)
              asset=nak-v0.19.5-darwin-amd64
              digest=0a1d0bed1296e30e00673427fb9ae726b377f6596b965b6212371b51eb061239
              go_asset=go1.25.0.darwin-amd64.tar.gz
              go_digest=5bd60e823037062c2307c71e8111809865116714d6f6b410597cf5075dfd80ef
              ;;
            arm64)
              asset=nak-v0.19.5-darwin-arm64
              digest=78d171d92d196bf5969b4ffd6ee6a04e7252852d79b1d6ffd6df1d63f1ee5524
              go_asset=go1.25.0.darwin-arm64.tar.gz
              go_digest=544932844156d8172f7a28f77f2ac9c15a23046698b6243f633b0a0b00c0749c
              ;;
            *)
              echo "unsupported macOS runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          mkdir -p "$RUNNER_TEMP/nak-bin"
          curl --fail --location --retry 3 \
            "https://github.com/fiatjaf/nak/releases/download/v0.19.5/$asset" \
            --output "$RUNNER_TEMP/nak-bin/nak"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/nak-bin/nak" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/nak-bin/nak"
          curl --fail --location --retry 3 \
            "https://go.dev/dl/$go_asset" \
            --output "$RUNNER_TEMP/$go_asset"
          printf '%s  %s\n' "$go_digest" "$RUNNER_TEMP/$go_asset" | shasum -a 256 -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$go_asset"
          export PATH="$RUNNER_TEMP/nak-bin:$RUNNER_TEMP/go/bin:$PATH"
          go version
          NMP_NIP29_HARNESS_BACKEND=host \
          NMP_NIP29_SKIP_SWIFT_FFI_BUILD=1 \
            tools/nip29-consumer-swift/run-capstone.sh \
            "$RUNNER_TEMP/nmp-nip29-swift-run" \
            "$RUNNER_TEMP/nmp-nip29-swift-evidence"

      - name: Build the Swift package
        id: swift_package
        if: ${{ !cancelled() && steps.apple_components.outcome == 'success' }}
        run: swift build
        working-directory: Packages/NMP

      - name: Test the Swift package
        if: ${{ !cancelled() && steps.swift_package.outcome == 'success' }}
        run: swift test --package-path Packages/NMP

      - name: Install xcodegen
        if: ${{ !cancelled() && steps.swift_package.outcome == 'success' }}
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate the iOS falsifier project
        if: ${{ !cancelled() && steps.swift_package.outcome == 'success' }}
        run: xcodegen generate
        working-directory: apps/Falsifier

      - name: Resolve an iOS Simulator destination
        if: ${{ !cancelled() && steps.swift_package.outcome == 'success' }}
        id: ios_sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 scripts/pick-ios-simulator-destination.py)
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test public-hostname NIP-11 on iOS Simulator
        if: ${{ !cancelled() && steps.swift_package.outcome == 'success' }}
        run: |
          xcodebuild test \
            -project Falsifier.xcodeproj \
            -scheme Falsifier \
            -destination "id=${{ steps.ios_sim.outputs.udid }}" \
            -only-testing:FalsifierTests/NMPSimulatorQualificationTests/testPublicHostnameUsesPlatformDNSOnIOSSimulator \
            -retry-tests-on-failure \
            -test-iterations 3
        working-directory: apps/Falsifier

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test prepared Swift and Kotlin outbox routing
        if: ${{ !cancelled() && steps.swift_package.outcome == 'success' }}
        run: scripts/check-native-outbox-routing-runtime.sh
