[package]
name = "nmp-consumer-check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The point of this crate: it depends on `nmp` and NOTHING else -- not even
# `nostr` directly, since every value type an app needs (including the
# unsigned-write path and every `DiagnosticsSnapshot` field type) must be
# reachable through `nmp`'s own re-exports. If a caller ever needs a second
# `use` line naming a mechanism crate or `nostr` itself, the facade's
# re-export inventory has a gap -- this crate existing and compiling IS the
# acceptance proof for #52's "an app's Cargo.toml names `nmp` alone".
#
# The protocol/content features are switched on here for the same reason: #851
# made `nmp::nip22` the ONE owner of the NIP-22 comment vocabulary, and #1239
# did the same for the families that were reachable from `nmp-ffi` and not from
# this facade. Turning a facade feature on is still "names `nmp` alone"; adding
# `nmp-content` or `nmp-blossom` to this dependency list would not be, which is
# exactly why this crate is where the claim gets checked rather than asserted.
#
# `nip02` is absent because it cannot be present: `nmp-nip02` depends on `nmp`,
# so the follow service sits above this facade rather than behind a feature of
# it, and no feature list here can reach it.
[dependencies]
nmp = { workspace = true, features = [
    "asset",
    "blossom",
    "content",
    "nip18",
    "nip22",
    "nip25",
    "nip29",
    "nipc7",
] }
