[package]
name = "nmp-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared test-only fixtures and process seams for NMP integration tests."

[dependencies]
nostr.workspace = true
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }

# The in-process scripted relay (`src/relays.rs`, approach doc §2.2/§2.3): the
# SAME `nostr-relay-builder` `LocalRelay` the engine's own
# `runtime_integration.rs` already uses, with its `WritePolicy`/`QueryPolicy`
# plugin points repurposed as the "was this relay ever contacted" world-side
# observable (independent of the engine's own diagnostics self-report).
#
# Deliberately NOT a glob import of its `prelude`: that re-exports a
# DIFFERENT `nostr` (0.45-alpha) than this workspace's pinned `nostr = "0.44.4"`
# -- see `nmp-transport/tests/mock_relay.rs` and
# `crates/nmp/tests/runtime_integration.rs`'s identical comment; every
# cross-version value is bridged explicitly by hex/id string round-trip.
nostr-relay-builder = "0.45.0-alpha.3"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
