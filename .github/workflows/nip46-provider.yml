name: Optional NIP-46 provider

on:
  push:
    branches: [master]
  pull_request:

jobs:
  package-removal:
    name: NIP-46 package removal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Delete NIP-46 and prove core plus an unrelated signer
        run: scripts/test-nip46-provider-removal.sh

  # Swift provider qualification shares the one macOS runner owned by
  # macos-qualification.yml. The Ubuntu removal and Kotlin proofs stay here.

  kotlin-provider:
    name: Kotlin NIP-46 component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build core and provider bindings
        run: |
          scripts/build-kotlin-jvm.sh
          cp Packages/NMPKotlin/src/main/resources/linux-x86-64/libnmp_ffi.so \
            "$RUNNER_TEMP/libnmp_ffi-core-only.so"
          scripts/build-kotlin-nip46-jvm.sh

      - name: Refuse unmanaged release identity
        run: scripts/test-component-identity-build.sh

      - name: Prove matched identity and package-set mismatch
        run: |
          scripts/check-nip46-component-identity.sh \
            "$RUNNER_TEMP/libnmp_ffi-core-only.so" \
            Packages/NMPKotlin/src/main/resources/linux-x86-64/libnmp_ffi.so \
            Packages/NMPKotlin/nip46/src/main/resources/linux-x86-64/libnmp_nip46_ffi.so

      - name: Prove the provider is absent from the core link/resource maps
        run: |
          scripts/check-nip46-artifact-inventory.sh \
            Packages/NMPKotlin/src/main/resources/linux-x86-64/libnmp_ffi.so \
            Packages/NMPKotlin/nip46/src/main/resources/linux-x86-64/libnmp_nip46_ffi.so \
            Packages/NMPKotlin/src/main/kotlin/uniffi \
            Packages/NMPKotlin/nip46/src/main/kotlin/uniffi

      - name: Test the selectable provider module
        run: ./gradlew :nip46:test --console=plain
        working-directory: Packages/NMPKotlin
