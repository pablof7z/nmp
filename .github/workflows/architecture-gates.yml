# Architecture review gates -- the mechanical checks from
# docs/design/architecture-review-gates.md (issue #496).
#
# Gate 5, Cross-SDK parity, has no mechanical check here: its previous check
# compared lowercase word bags across whole files, including comments and
# string literals, and passed with the Swift SDK reduced to a single comment
# listing the missing concepts (see AGENTS.md and #1637). It was deleted
# rather than left green. The invariant is real and still owned by gate 5;
# the mechanism is a known gap until a declaration-level replacement lands.
#
# Alongside it live narrow, per-boundary structural checks that enforce one
# specific ownership contract each (currently the NIP-29 cluster's context,
# kind-blindness, and cross-surface checks -- #838/#1653 -- and #879's pure
# content/locator boundary). Same character, same trust properties.
#
# These checks require no secrets and make no pull_request_target trust
# decisions, so an ordinary reviewable workflow is the right home.
#
# Every job here gates on content only and never executes PR-provided code
# beyond these repo scripts.

name: Architecture gates

on:
  push:
    branches: [master]
  pull_request:

# Every step runs through one hardened shell (#1170). GitHub's default `run:`
# shell honours BASH_ENV, $ENV, profile files, and shell functions inherited
# from the environment, so the command a step names is not necessarily the
# command that runs -- a step can report success having executed something
# else while the workflow text still reads correctly. `-p` makes bash ignore
# all four; `--noprofile --norc` covers the startup files; `-eo pipefail`
# keeps a failure anywhere in a step fatal.
defaults:
  run:
    shell: bash --noprofile --norc -p -eo pipefail {0}


jobs:
  rust-toolchain-reproducibility:
    name: Reproducible Rust toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the exact repository Rust toolchain
        run: rustup show

      - name: Match compiler, Cargo, Clippy, and rustfmt to the committed oracle
        run: bash scripts/check-rust-toolchain.sh

      - name: Falsify floating, mismatched, and incomplete pins
        run: bash scripts/test-rust-toolchain.sh

  tool-requirements:
    name: Verification tools fail closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse success when a checker dependency is absent
        run: bash scripts/test-check-tool-requirements.sh

  # #879: NIP-19/NIP-21 decoding preserves exact authored locator data and
  # must never regain engine, acquisition-policy, or compatibility-planner
  # ownership.
  content-parser-boundary:
    name: Pure content/locator boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain
        run: rustup show

      - name: Install the content-boundary checker's search tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Forbid acquisition policy and engine dependencies in locator parsing
        run: bash scripts/check-content-parser-boundary.sh

  # #838: NIP-29 contributes group context to a complete draft whose kind and
  # schema it does not own; NIP-C7 independently owns kind:9/q replies; client
  # mention and notification policy belongs to neither protocol module.
  nip29-ownership:
    name: NIP-29 exact context ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Keep NIP-29 context separate from C7 and client policy
        run: bash scripts/check-nip29-ownership.sh

  # #1122 (PROTOCOL-NIP29OPERATIONS-012/013): the nine NIP-29-owned named
  # operations, and only those nine, get named composers on every surface --
  # Rust facade, FFI, Swift, Kotlin -- each taking semantic fields plus a
  # retained capability, never a raw kind, tag, relay or route. Invoked
  # directly (not via `bash`) so its exact executable name is this job's own
  # #1074 evidence locator (`script:repository::scripts/check-nip29-
  # surfaces.sh`, features/groups/one-typed-group-door.feature).
  #
  # #1653 renamed this from check-nip29-operation-catalogue.sh and folded in
  # two now-deleted scripts/workflows (check-nip29-read-door.sh's whole
  # read-lifecycle claim, and check-nip29-group-list-ownership.sh's
  # non-vacuous requirements), collapsing a five-script NIP-29 gate cluster
  # spread across three workflow files down to two scripts in this one job
  # plus the kind-blindness job below.
  nip29-surfaces:
    name: NIP-29 exhaustive operation catalogue and read-lifecycle, every surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Only the nine modeled operations get named composers, semantic-only, and no surface grows a read lifecycle of its own
        run: scripts/check-nip29-surfaces.sh

  # #1124 (PROTOCOL-KINDBLINDNESS-001..005): the NIP-29 group publication/read
  # path stays kind-blind -- no kind constant it does not itself define, and
  # no branch anywhere that reads an app-selected kind. Invoked directly (not
  # via `bash`) so its exact executable path is this job's own #1074 evidence
  # locator (`script:repository::scripts/check-nip29-kind-blindness.sh`,
  # `features/groups/kind-blindness.feature`).
  #
  # #1653 folded this in from its own former top-level workflow file
  # (nip29-kind-blindness.yml) as part of the same NIP-29 gate-cluster
  # collapse, and absorbed check-nip29-ownership.sh's own kind-9/chat-schema
  # decoy-name ban, which used to truncate its scan at the file's first
  # `#[cfg(test)]` marker.
  nip29-kind-blindness:
    name: NIP-29 owns no kind it does not itself define
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: The checker's self-test proves it can fail against real mutated fixtures
        run: scripts/test-nip29-kind-blindness.sh

      - name: The group publication/read path stays kind-blind
        run: scripts/check-nip29-kind-blindness.sh

  # NMP keeps no backwards compatibility: a replaced spelling is deleted in the
  # same change. There are no external consumers, so compatibility is a tax
  # paid to strangers who do not exist.
  store-table-names:
    name: Current table names stay inside nmp-store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse production table-name literals outside nmp-store
        run: bash scripts/check-store-table-names.sh

  no-compatibility-surface:
    name: No compatibility surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse a declared deprecation
        run: bash scripts/check-no-compatibility-surface.sh

  ffi-facade-boundary:
    name: FFI consumes the canonical nmp facade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Keep nmp-ffi off direct mechanism-crate edges
        run: bash scripts/check-ffi-facade-boundary.sh

  # One owner per property (#1657). The current account was stored twice and
  # held equal by six pairs of adjacent statements that nothing typed, while
  # the sign-event author check and reactive re-rooting read different copies.
  # The behavioural half of the falsifier is
  # `nmp::every_current_account_reader_sees_the_same_selection_through_a_full_lifecycle`;
  # this refuses the reintroduced field before behaviour is exercised.
  one-current-account:
    name: The current account is stored once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse a second stored current account in the runtime
        run: bash scripts/check-one-current-account.sh

  # A 600-line hard cap per file, scoped to crates/nmp-bdd. The cap was a norm
  # before it was a check, which is how that tree's `world.rs` reached 1,333
  # lines; the script's own header records why the scope is this one crate and
  # not the workspace (97 of 299 tracked .rs files are over the cap today).
  bdd-file-length:
    name: BDD file-length cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Keep every crates/nmp-bdd file under 600 lines
        run: bash scripts/check-bdd-file-length.sh
