[package]
name = "nmp-consumer-check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The point of this crate: every GENERIC engine/query/write/diagnostics noun
# below is reachable from `nmp` alone -- not even `nostr` directly, since
# every such value type is reached through `nmp`'s own re-exports. If a
# caller ever needs a second `use` line naming a mechanism crate or `nostr`
# itself for one of THOSE nouns, the facade's re-export inventory has a gap
# -- this crate existing and compiling IS the acceptance proof for #52's "an
# app's Cargo.toml names `nmp` alone" for the engine surface, not for any
# one capability's meaning.
#
# The protocol/content features are switched on here for the same reason: #851
# made `nmp::nip22` the ONE owner of the NIP-22 comment vocabulary, and #1239
# did the same for the families that were reachable from `nmp-ffi` and not from
# this facade. Turning a facade feature on is still "names `nmp` alone"; adding
# `nmp-content` or `nmp-blossom` to this dependency list would not be, which is
# exactly why this crate is where the claim gets checked rather than asserted.
#
# `nmp-nip02` is a SEPARATE, EXPLICIT dependency line below, not a feature:
# #1707 reversed #1143/#1563 and reopened the rule that `nmp` must not
# contain a single capability-specific line, NIP-02 included. A direct-Rust
# app that wants NIP-02 -- or media composition, already handled the same
# way -- names `nmp-nip02` alongside `nmp`, the uniform two-crate cost every
# capability now pays for direct-Rust reach. This crate names it explicitly
# rather than pretending the whole workspace collapses into one `Cargo.toml`
# line; that pretense is exactly what #1707 falsifies.
[dependencies]
nmp = { workspace = true, features = [
    "asset",
    "blossom",
    "content",
    "nip18",
    "nip22",
    "nip25",
    "nip29",
    "nipc7",
] }
nmp-nip02.workspace = true
