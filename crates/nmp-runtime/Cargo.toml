[package]
name = "nmp-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

test-instrumentation = [
    "nmp-engine/test-instrumentation",
    "nmp-store/test-instrumentation",
    "nmp-nip11/test-instrumentation",
]

# This is the crate that is ALLOWED to own threads and a runtime -- that is
# what it is for. The split is what makes the reducer's manifest meaningful:
# `tokio`, `crossbeam-channel` and the transport pool live here, and
# `nmp-engine`, which this crate drives, names none of them.
[dependencies]
nostr.workspace = true
nmp-grammar.workspace = true
nmp-engine.workspace = true
nmp-store.workspace = true
nmp-router.workspace = true
nmp-resolver.workspace = true
nmp-transport.workspace = true
nmp-signer.workspace = true
nmp-local-signer.workspace = true
nmp-nip11.workspace = true
crossbeam-channel = "0.5"
# #704: the engine owns ONE multi-thread tokio runtime (2 workers) that hosts
# every adapter task (NIP-11 fetches, signer/AUTH completion awaits, optional
# provider sessions, follow-action acquisition). `rt-multi-thread` is a
# production feature, not a dev-only one; `Handle::adapter_runtime()` hands
# protocol adapters that same runtime handle.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "sync"] }
# The opaque session payload's secret bytes are wiped on drop.
zeroize = "1"
